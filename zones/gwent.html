<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gwent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    #compare-chart { touch-action: pan-y; }

    .tabs { display:flex; justify-content:center; gap:6px; margin:6px 0 12px; }
    .tabs button { padding:6px 10px; border:1px solid var(--border,#3a3a3a); background:transparent; color:inherit; cursor:pointer; }
    .tabs button.active { font-weight:600; background:rgba(255,255,255,0.06); }

    /* New graph controls */
    .controls{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border)}
    .range-buttons{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.5rem}
    .range-buttons .seg{
      background:#0f1623;border:1px solid var(--border);color:var(--text);
      padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem;
    }
    .range-buttons .seg:hover{background:rgba(255,255,255,.05)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1 class="site-title"><a href="../index.html">J-Ratings</a></h1>
      <span class="muted subtitle"></span>
    </div>
    <nav class="zones" aria-label="Zones">
      <a href="dyfed.html">Dyfed</a>
      <a href="east-glam.html">East Glamorgan</a>
      <a href="gwent.html" class="active-zone">Gwent</a>
      <a href="north-wales.html">North Wales</a>
      <a href="west-wales.html">West Wales</a>
      <a href="../compare.html">Compare</a>
    </nav>
    <div class="clubs-nav"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <h2 id="zone-title">Gwent</h2>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">
      <span id="count" class="muted"></span>
      <button id="compare-btn" class="club-btn" type="button" style="margin-left:auto">Compare</button>
    </div>

    <!-- Chart controls -->
    <div class="controls" id="chart-controls" style="display:none">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label for="agg">View:</label>
        <select id="agg">
          <option value="daily" selected>Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>

        <div class="range-buttons">
          <button class="seg" data-range="ALL">ALL</button>
          <button class="seg" data-range="2015">2015–Present</button>
          <button class="seg" data-range="2022">2022–Present</button>
          <button class="seg" data-range="LY">Last Year</button>
          <button class="seg" data-range="YTD">YTD</button>
        </div>
      </div>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart" style="height:450px"></div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:240px">Player</th>
            <th class="right" id="rating-col" style="min-width:120px">Live rating</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Compare Selection Modal -->
  <div id="compare-modal" style="display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.6);
    justify-content:center; align-items:center; z-index:9999;">
    <div style="background:#1a1a1a; padding:20px; border-radius:8px;
      max-width:500px; width:90%; max-height:80%; overflow:auto; color:#fff;">
      <h3>Select players to view:</h3>
      <div class="compare-actions" style="margin-bottom:12px;">
        <button class="compare-show" style="margin-right:10px">Show Selected</button>
        <button class="compare-cancel">Cancel</button>
      </div>
      <div id="compare-list" style="margin:20px 0;"></div>
      <div class="compare-actions" style="margin-top:12px;">
        <button class="compare-show" style="margin-right:10px">Show Selected</button>
        <button class="compare-cancel">Cancel</button>
      </div>
    </div>
  </div>
</main>

<script>
/* --- CONFIG --- */
const ZONE_CODE='G1';
const ZONE_NAME='Gwent';
const DATA_URL='../data/players.json';
const HIST_URL=id=>`../data/history/${encodeURIComponent(id)}.json`;
const MAX_SERIES=20;

/* --- STATE --- */
const state={rows:[],filtered:[],selectedClub:null,players:[],dataMin:null,dataMax:null,initialRangeSet:false};

/* --- Normalisation + Aggregation (same as compare.html) --- */
function iso(d){return new Date(d).toISOString().slice(0,10);}
function normalise(series){
  return series.filter(p=>p&&p.x&&Number.isFinite(p.y))
    .map(p=>({x:p.x,y:+p.y}))
    .sort((a,b)=>new Date(a.x)-new Date(b.x));
}
function aggregateExpanded(series,mode){
  if(mode==='daily')return normalise(series);
  const buckets={};
  for(const p of series){
    const d=new Date(p.x);
    let key;
    if(mode==='weekly'){
      const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
      const dayNum=tmp.getUTCDay()||7;
      tmp.setUTCDate(tmp.getUTCDate()+4-dayNum);
      const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
      const weekNo=Math.ceil((((tmp-yearStart)/86400000)+1)/7);
      key=`${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
    }else if(mode==='monthly'){
      key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }else if(mode==='quarterly'){
      const q=Math.floor(d.getMonth()/3)+1;
      key=`${d.getFullYear()}-Q${q}`;
    }else key=`${d.getFullYear()}`;
    (buckets[key] ||= []).push(p.y);
  }
  const out=Object.keys(buckets).sort().map(k=>{
    const ys=buckets[k].filter(Number.isFinite);
    const avg=ys.reduce((a,b)=>a+b,0)/ys.length;
    let x;
    if(k.includes('W')){
      const [y,w]=k.split('-W');const year=+y,week=+w;
      const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
      const dow=simple.getUTCDay();
      if(dow<=4)simple.setUTCDate(simple.getUTCDate()-dow+1);
      else simple.setUTCDate(simple.getUTCDate()+8-dow);
      x=iso(simple);
    }else if(k.includes('Q')){
      const [y,q]=k.split('-Q');const year=+y,quarter=+q;
      const month=(quarter-1)*3;
      x=iso(new Date(Date.UTC(year,month,1)));
    }else if(k.length===7)x=`${k}-01`;
    else x=`${k}-01-01`;
    return {x,y:avg};
  });
  return normalise(out);
}

/* --- Extent helpers --- */
function extentFrom(seriesList){
  const xs=[];
  for(const s of seriesList){if(!s)continue;for(const p of s){if(p?.x)xs.push(new Date(p.x));}}
  if(!xs.length)return{min:null,max:null};
  return{min:new Date(Math.min(...xs)),max:new Date(Math.max(...xs))};
}
function majorGridShapes(ymin,ymax){
  const shapes=[];for(let v=ymin;v<=ymax;v+=50){
    shapes.push({type:'line',xref:'paper',x0:0,x1:1,y0:v,y1:v,line:{width:1,color:'rgba(128,128,128,0.35)'},layer:'below'});
  }return shapes;
}

/* --- Graph core --- */
function adjustYToVisible(x0,x1){
  const s=new Date(x0),e=new Date(x1);
  const gd=document.getElementById('compare-chart');
  if(!gd||!gd.data)return;
  const ys=[];
  for(const trace of gd.data){
    const pts=trace.x.map((x,i)=>({x:trace.x[i],y:trace.y[i]}));
    ys.push(...pts.filter(p=>{const d=new Date(p.x);return d>=s&&d<=e;}).map(p=>p.y));
  }
  if(!ys.length)return;
  const ymin=Math.floor(Math.min(...ys)/50)*50;
  const ymax=Math.ceil(Math.max(...ys)/50)*50;
  Plotly.relayout('compare-chart',{'yaxis.range':[ymin,ymax],'shapes':majorGridShapes(ymin,ymax)});
}
function setXRange(start,end){
  if(!state.dataMin||!state.dataMax)return;
  const s=new Date(Math.max(new Date(start),state.dataMin));
  const e=new Date(Math.min(new Date(end),state.dataMax));
  const x0=iso(s),x1=iso(e);
  Plotly.relayout('compare-chart',{'xaxis.range':[x0,x1]}).then(()=>adjustYToVisible(x0,x1));
}
function setPreset(which){
  const now=new Date();
  if(which==='ALL'){setXRange(state.dataMin,state.dataMax);return;}
  if(which==='YTD'){const yStart=new Date(Date.UTC(now.getUTCFullYear(),0,1));setXRange(yStart,state.dataMax);return;}
  if(which==='LY'){const end=state.dataMax?new Date(state.dataMax):now;const start=new Date(end.getTime()-365*24*60*60*1000);setXRange(start,end);return;}
  const y=parseInt(which,10);const start=new Date(Date.UTC(y,0,1));setXRange(start,state.dataMax);
}

/* --- Build chart (same look as compare.html) --- */
async function buildComparison(players){
  const chart=document.getElementById('compare-chart');
  const controls=document.getElementById('chart-controls');
  chart.innerHTML='';
  document.getElementById('compare-wrap').style.display='block';
  controls.style.display='block';

  const mode=document.getElementById('agg').value;
  const series=[];
  await Promise.all(players.map(async p=>{
    const res=await fetch(HIST_URL(p.id));if(!res.ok)return;
    const hist=await res.json();
    const raw=hist.map(h=>({x:h.date,y:+h.rating}));
    const s=aggregateExpanded(raw,mode);
    series.push({
      name:p.name,
      x:s.map(d=>d.x),
      y:s.map(d=>d.y),
      mode:(mode==='daily'?'lines':'lines+markers'),
      marker:(mode==='daily'?{size:0}:{size:4}),
      line:{width:2},
      hovertemplate:'%{y:.0f}<extra>'+p.name+'</extra>'
    });
  }));
  if(!series.length){chart.innerHTML='No data.';return;}

  const allY=series.flatMap(s=>s.y).filter(Number.isFinite);
  const ymin=Math.floor(Math.min(...allY)/50)*50;
  const ymax=Math.ceil(Math.max(...allY)/50)*50;

  const ext=extentFrom(series.map(s=>s.x.map((x,i)=>({x:s.x[i],y:s.y[i]}))));
  state.dataMin=ext.min;state.dataMax=ext.max;

  const layout={
    margin:{t:30,r:20,l:50,b:50},
    paper_bgcolor:'#0f1623',plot_bgcolor:'#0f1623',
    font:{color:'#ccc'},
    xaxis:{
      type:'date',gridcolor:'#222',zeroline:false,
      rangeslider:{visible:true,thickness:0.12,borderwidth:0,bgcolor:'#0f1623',bordercolor:'#0f1623'}
    },
    yaxis:{title:'Rating',gridcolor:'#222',zeroline:false,tickformat:'.0f'},
    legend:{x:1,y:0,bgcolor:'rgba(0,0,0,0)'},
    shapes:majorGridShapes(ymin,ymax)
  };
  if(!state.initialRangeSet&&state.dataMin&&state.dataMax){
    const end=new Date(state.dataMax);
    const start=new Date(end.getTime()-365*24*60*60*1000);
    layout.xaxis.range=[iso(new Date(Math.max(start,state.dataMin))),iso(end)];
    state.initialRangeSet=true;
  }
  Plotly.newPlot('compare-chart',series,layout,{responsive:true,displayModeBar:false})
    .then(gd=>{
      const xr=gd.layout.xaxis.range||gd._fullLayout.xaxis.range;
      if(xr&&xr.length===2)adjustYToVisible(xr[0],xr[1]);
      gd.on('plotly_relayout',ev=>{
        const x0=ev['xaxis.range[0]']??(ev['xaxis.range']&&ev['xaxis.range'][0]);
        const x1=ev['xaxis.range[1]']??(ev['xaxis.range']&&ev['xaxis.range'][1]);
        if(x0&&x1)adjustYToVisible(x0,x1);
      });
    });
}

/* --- Table + Modal setup (same as before) --- */
async function load(){
  const res=await fetch(DATA_URL);
  const data=await res.json();
  state.rows=data.filter(d=>d.zone===ZONE_CODE).sort((a,b)=>b.rating-a.rating);
  state.filtered=state.rows.slice();

  const tbody=document.querySelector('#players tbody');
  tbody.innerHTML='';
  for(const r of state.filtered){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><a href="../player.html?id=${encodeURIComponent(r.id)}">${r.name}</a></td>
      <td class="right">${Math.round(r.rating)}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById('count').textContent=`${state.filtered.length} players`;
}
function setupButtons(){
  document.querySelectorAll('.range-buttons .seg').forEach(btn=>{
    btn.addEventListener('click',()=>setPreset(btn.dataset.range));
  });
  document.getElementById('agg').addEventListener('change',()=>{
    if(state.lastPlayers)buildComparison(state.lastPlayers);
  });
  document.getElementById('compare-btn').addEventListener('click',async()=>{
    const players=state.filtered.slice(0,MAX_SERIES);
    state.lastPlayers=players;
    buildComparison(players);
  });
}

/* --- init --- */
load().then(setupButtons);
</script>
</body>
</html>
