<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>East Glamorgan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title" style="align-items:center;gap:16px">
      <h1 style="margin:0;font-size:1.2rem">
        <a href="../index.html" style="color:var(--text);text-decoration:none">J-Ratings</a>
      </h1>
      <span class="muted">Alternate WCU Ratings with Live Batch</span>
    </div>
    <nav class="zones" aria-label="Zones">
      <a href="dyfed.html">Dyfed</a>
      <a href="east-glam.html" class="active-zone">East Glamorgan</a>
      <a href="gwent.html">Gwent</a>
      <a href="north-wales.html">North Wales</a>
      <a href="west-wales.html">West Wales</a>
    </nav>
    <div class="clubs-nav"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <h2 id="zone-title">East Glamorgan</h2>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">
      <span id="count" class="muted"></span>
      <button id="compare-btn" class="club-btn" type="button" style="margin-left:auto">Compare</button>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart" style="height:420px"></div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:240px">Player</th>
            <th class="right" style="min-width:120px">Live rating</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const ZONE_CODE = 'E1';
const DATA_URL = '../data/players.json';
const state = { rows: [], filtered: [], selectedClub: null };

// Club codes → names (exclude “All Players” / “Improvement”)
const clubNames = {
  "2BR": "Bridgend",
  "2BY": "Barry",
  "2CD": "Cardiff",
  "2CP": "Caerphilly",
  "2CU": "Cardiff University",
  "2EG": "East Glam Zone",
  "2NC": "North Cardiff",
  "2NE": "Nelson",
  "2PN": "Penarth",
  "2PP": "Pontypridd",
  "2PR": "Pentyrch",
  "2RH": "Rhondda",
  "2SJ": "St John's College"
};

function render() {
  const tbody = document.querySelector('#players tbody');
  tbody.innerHTML = '';
  for (const r of state.filtered) {
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    const a = document.createElement('a');
    a.href = `../player.html?id=${encodeURIComponent(r.id)}`;
    a.textContent = r.name;
    tdName.appendChild(a);

    const tdRt = document.createElement('td');
    tdRt.className = 'right';
    tdRt.textContent = Math.round(r.rating);

    tr.appendChild(tdName);
    tr.appendChild(tdRt);
    tbody.appendChild(tr);
  }
  document.getElementById('count').textContent =
    `${state.filtered.length.toLocaleString()} players`;
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = state.rows;
  if (state.selectedClub) list = list.filter(r => r.club === state.selectedClub);
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q));
  state.filtered = list;
  render();
  hideCompare(); // keep chart state in sync
}

// ---- Compare helpers (same pattern as West Wales) ----
async function fetchHistoryFor(id) {
  const url = `../data/history/${encodeURIComponent(id)}.json`;
  try {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) return null;
    const rows = await res.json();
    return Array.isArray(rows) && rows.length ? rows : null;
  } catch { return null; }
}

async function buildComparison(players) {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  const MAX_SERIES = 12;

  const chosen = players.slice(0, MAX_SERIES);
  const series = await Promise.all(chosen.map(async p => {
    const hist = await fetchHistoryFor(p.id);
    if (!hist) return null;
    return {
      name: p.name,
      x: hist.map(d => d.date),
      y: hist.map(d => d.rating),
      mode: 'lines',
      hovertemplate: '%{x}<br>%{y}<extra>' + p.name + '</extra>'
    };
  }));

  const traces = series.filter(Boolean);
  if (!traces.length) {
    wrap.style.display = 'block';
    chart.innerHTML = 'No rating history found for this selection.';
    return;
  }

  const bg = getComputedStyle(document.body).backgroundColor;
  const fg = getComputedStyle(document.body).color;

  Plotly.newPlot(chart, traces, {
    margin:{l:50,r:20,t:10,b:40},
    xaxis:{type:'date', title:''},
    yaxis:{title:'Rating'},
    legend:{orientation:'h'},
    paper_bgcolor:bg, plot_bgcolor:bg, font:{color:fg}
  }, {displayModeBar:false, responsive:true});

  wrap.style.display = 'block';
}

function hideCompare() {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  wrap.style.display = 'none';
  chart.innerHTML = '';
}

function setupCompareButton() {
  const btn = document.getElementById('compare-btn');
  btn.addEventListener('click', async () => {
    const list = state.filtered.slice(); // current view (club + search)
    if (!list.length) {
      alert('No players found for this selection.');
      return;
    }
    document.getElementById('compare-chart').innerHTML = 'Loading…';
    await buildComparison(list);
  });
}

// ---- Load ----
async function load() {
  const res = await fetch(DATA_URL, { cache: 'no-cache' });
  const data = await res.json();

  // Zone filter
  state.rows = data
    .filter(d => d.zone === ZONE_CODE)
    .sort((a, b) => b.rating - a.rating);
  state.filtered = state.rows.slice();

  // Build club buttons (only codes we recognise and that start with a digit)
  const clubsNav = document.querySelector('.clubs-nav');
  const clubs = [...new Set(
    state.rows.map(r => r.club).filter(c => /^\d/.test(c) && clubNames[c])
  )].sort();

  clubsNav.innerHTML =
    `<button class="club-btn active-club" data-code="">All</button>` +
    clubs.map(c => `<button class="club-btn" data-code="${c}">${clubNames[c]}</button>`).join(' ');

  const zoneTitle = document.getElementById('zone-title');

  // Club filter logic
  clubsNav.addEventListener('click', e => {
    if (!e.target.classList.contains('club-btn')) return;
    document.querySelectorAll('.club-btn').forEach(b => b.classList.remove('active-club'));
    e.target.classList.add('active-club');

    const code = e.target.dataset.code;
    state.selectedClub = code || null;
    zoneTitle.textContent = code ? clubNames[code] : 'East Glamorgan';
    applyFilter();
  });

  render();
  setupCompareButton();
}

document.getElementById('q').addEventListener('input', applyFilter);
load();
</script>
</body>
</html>
