<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dyfed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    /* Let the page scroll vertically over the chart on touch devices */
    #compare-chart { touch-action: pan-y; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
  <h1 class="site-title"><a href="../index.html">J-Ratings</a></h1>
  <span class="muted subtitle"></span>
</div>
    <nav class="zones" aria-label="Zones">
      <a href="dyfed.html" class="active-zone">Dyfed</a>
      <a href="east-glam.html">East Glamorgan</a>
      <a href="gwent.html">Gwent</a>
      <a href="north-wales.html">North Wales</a>
      <a href="west-wales.html">West Wales</a>
      <a href="../compare.html">Compare</a>
    </nav>
    <div class="clubs-nav"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <h2 id="zone-title">Dyfed</h2>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">
      <span id="count" class="muted"></span>
      <button id="compare-btn" class="club-btn" type="button" style="margin-left:auto">Compare</button>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart" style="height:300px"></div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:240px">Player</th>
            <th class="right" style="min-width:120px">Live rating</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <!-- Compare Selection Modal -->
<div id="compare-modal" style="
  display:none; 
  position:fixed; 
  top:0; left:0; 
  width:100%; height:100%; 
  background:rgba(0,0,0,0.6); 
  justify-content:center; 
  align-items:center;
  z-index:9999;
">
  <div style="
    background:#1a1a1a;
    padding:20px;
    border-radius:8px;
    max-width:500px;
    width:90%;
    max-height:80%;
    overflow:auto;
    color:#fff;
  ">
    <h3>Select players to view:</h3>
    <div id="compare-list" style="margin-bottom:20px;"></div>
    <button id="compare-show" style="margin-right:10px">Show Selected</button>
    <button id="compare-cancel">Cancel</button>
  </div>
</div>

</main>

<script>
/* ---------- CONFIG ---------- */
const ZONE_CODE = 'D1';
const ZONE_NAME = 'Dyfed';
const DATA_URL  = '../data/players.json';

// Include players with history on/after this date; set null to include all
const COMPARE_SINCE = null;

// Limit traces after filtering
const MAX_SERIES = 50;

// Club code → name
const clubNames = {
  "4CG": "Cardigan",
  "4CM": "Carmarthen",
  "4AB": "Aberystwyth",
  "4PB": "Pembs",
  "4AU": "Aberystwyth University"
};

/* ---------- STATE & RENDER ---------- */
const state = { rows: [], filtered: [], selectedClub: null };

function renderTable() {
  const tbody = document.querySelector('#players tbody');
  tbody.innerHTML = '';
  for (const r of state.filtered) {
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    const a = document.createElement('a');
    a.href = `../player.html?id=${encodeURIComponent(r.id)}`;
    a.textContent = r.name;
    tdName.appendChild(a);

    const tdRt = document.createElement('td');
    tdRt.className = 'right';
    tdRt.textContent = Math.round(r.rating);

    tr.appendChild(tdName);
    tr.appendChild(tdRt);
    tbody.appendChild(tr);
  }
  document.getElementById('count').textContent =
    `${state.filtered.length.toLocaleString()} players`;
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = state.rows;
  if (state.selectedClub) list = list.filter(r => r.club === state.selectedClub);
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q));
  state.filtered = list;
  renderTable();
  hideCompare();
}

/* ---------- COMPARE CHART ---------- */
const histCache = new Map(); // id -> array|null

async function fetchHistoryFor(id) {
  if (histCache.has(id)) return histCache.get(id);

  async function tryUrl(url) {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) return null;
    const rows = await res.json();
    return Array.isArray(rows) && rows.length ? rows : null;
  }

  // tolerate raw vs already-encoded ids
  let hist = await tryUrl(`../data/history/${id}.json`);
  if (!hist) hist = await tryUrl(`../data/history/${encodeURIComponent(id)}.json`);

  histCache.set(id, hist ?? null);
  return hist ?? null;
}

function hideCompare() {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  wrap.style.display = 'none';
  chart.innerHTML = '';
}

async function buildComparison(players) {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  wrap.style.display = 'block';
  chart.innerHTML = 'Loading…';

  const withHist = [];
  await Promise.all(players.map(async p => {
    const hist = await fetchHistoryFor(p.id);
    if (!hist) return;

    const use = COMPARE_SINCE ? hist.filter(d => d.date >= COMPARE_SINCE) : hist;
    if (use.length) withHist.push({ p, hist: use });
  }));

  if (!withHist.length) {
    chart.innerHTML = COMPARE_SINCE
      ? `No rating history since ${COMPARE_SINCE}.`
      : 'No rating history found.';
    return;
  }

  // Sort by most recent activity and cap
  withHist.sort((a, b) =>
    b.hist[b.hist.length - 1].date.localeCompare(a.hist[a.hist.length - 1].date)
  );
  const picked = withHist.slice(0, MAX_SERIES);

  // Touch detection ONCE (used below)
  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  const traces = picked.map(({ p, hist }) => {
    if (isTouch) {
      // Mobile: static plot with label at end of each line
      const n = hist.length;
      const text = hist.map((_, i) => (i === n - 1 ? p.name : ''));
      return {
        name: p.name,
        x: hist.map(d => d.date),
        y: hist.map(d => d.rating),
        mode: 'lines+text',
        text,
        textposition: 'middle right',
        textfont: { size: 10 },
        cliponaxis: false,
        hoverinfo: 'skip'
      };
    } else {
      // Desktop: interactive hover
      return {
        name: p.name,
        x: hist.map(d => d.date),
        y: hist.map(d => d.rating),
        mode: 'lines',
        hovertemplate: '%{x} => %{y}<extra>' + p.name + '</extra>'
      };
    }
  });

  const cs = getComputedStyle(document.body);
  const layout = {
    margin: { l: 50, r: (isTouch ? 110 : 20), t: 10, b: 40 }, // extra right space on mobile for labels
    xaxis: { type: 'date', title: '' },
    yaxis: { title: 'Rating' },
    legend: { orientation: 'h' },
    paper_bgcolor: cs.backgroundColor,
    plot_bgcolor: cs.backgroundColor,
    font: { color: cs.color }
  };

  const config = isTouch
    ? { displayModeBar: false, responsive: true, staticPlot: true }
    : { displayModeBar: false, responsive: true, scrollZoom: false, doubleClick: false, dragMode: false };

  Plotly.newPlot(chart, traces, layout, config);
}

function setupCompareButton() {
  const modal = document.getElementById('compare-modal');
  const listDiv = document.getElementById('compare-list');
  const showBtn = document.getElementById('compare-show');
  const cancelBtn = document.getElementById('compare-cancel');

  document.getElementById('compare-btn').addEventListener('click', () => {
    // Build the list of checkboxes from currently filtered players
    listDiv.innerHTML = '';
    state.filtered.forEach(p => {
      const id = `chk-${p.id}`;
      const wrapper = document.createElement('div');
      wrapper.style.marginBottom = '6px';
      wrapper.innerHTML = `
        <label style="cursor:pointer">
          <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
          ${p.name} (${Math.round(p.rating)})
        </label>
      `;
      listDiv.appendChild(wrapper);
    });
    modal.style.display = 'flex';
  });

  cancelBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  showBtn.addEventListener('click', async () => {
    const selectedIds = Array.from(listDiv.querySelectorAll('input[type=checkbox]:checked'))
      .map(cb => cb.value);
    if (!selectedIds.length) {
      alert('Please select at least one player.');
      return;
    }
    modal.style.display = 'none';
    const chosenPlayers = state.filtered.filter(p => selectedIds.includes(p.id));
    await buildComparison(chosenPlayers);
  });
}

/* ---------- LOAD ---------- */
async function load() {
  const res = await fetch(DATA_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('Failed to load players.json');
  const data = await res.json();

  state.rows = data
    .filter(d => d.zone === ZONE_CODE)
    .sort((a, b) => b.rating - a.rating);

  state.filtered = state.rows.slice();

  // Build club buttons only for codes present and known
  const clubsNav = document.querySelector('.clubs-nav');
  const clubs = [...new Set(
    state.rows.map(r => r.club).filter(c => /^\d/.test(c) && clubNames[c])
  )].sort();

  clubsNav.innerHTML =
    `<button class="club-btn active-club" data-code="">All</button>` +
    clubs.map(c => `<button class="club-btn" data-code="${c}">${clubNames[c]}</button>`).join(' ');

  // Title
  document.getElementById('zone-title').textContent = ZONE_NAME;

  // Compare button: only show when a club is selected
  document.getElementById('compare-btn').style.display = 'none';

  clubsNav.addEventListener('click', e => {
    if (!e.target.classList.contains('club-btn')) return;

    document.querySelectorAll('.club-btn').forEach(b => b.classList.remove('active-club'));
    e.target.classList.add('active-club');

    const code = e.target.dataset.code;
    state.selectedClub = code || null;
    document.getElementById('zone-title').textContent = code ? clubNames[code] : ZONE_NAME;
    document.getElementById('compare-btn').style.display = code ? 'inline-block' : 'none';

    applyFilter();
  });

  renderTable();
  setupCompareButton();
}

document.getElementById('q').addEventListener('input', applyFilter);
load().catch(err => {
  document.querySelector('#players tbody').innerHTML =
    `<tr><td colspan="2">Error loading data: ${err.message}</td></tr>`;
});
</script>
</body>
</html>
