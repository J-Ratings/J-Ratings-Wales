<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    :root{
      --wdl-win:#14b85a;
      --wdl-draw:#f4c430;
      --wdl-loss:#e53935;
    }

.player-head{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin:12px 0;
  padding:0 12px;
  gap:1rem;
}

h2#pname{
  margin:0;
  padding:0;
  border-bottom:none;
  text-align:center;
  font-size:2rem;
}

.player-rating-badge{
  justify-self:start;
}

.best-results-badge{
  justify-self:end;
}

    .badge{
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:8px;
      padding:6px 10px;
      margin-right:4px;
      white-space:nowrap;
      display:flex;
      align-items:flex-start;
      flex-direction:column;
      gap:.5rem;
    }

    .badge .stack{
      display:flex;
      flex-direction:column;
      gap:.25rem;
    }

    .badge strong{
      font-variant-numeric:tabular-nums;
    }

    #stats-j .muted{
      color:#1f77b4;
      font-weight:bold;
    }

    #stats-wcu .muted{
      color:#ff7f0e;
      font-weight:bold;
    }

    .btn-mini{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      padding:4px 8px;
      border-radius:6px;
      cursor:pointer;
      font-size:.9rem;
    }

    .btn-mini[disabled]{
      opacity:.5;
      cursor:default;
    }

    .btn-mini:hover:not([disabled]){
      background:rgba(255,255,255,.05);
    }

    #chart{
      height:420px;
      touch-action:pan-y;
    }

    .range-buttons{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      align-items:center;
      margin:.5rem 0 .25rem 0;
    }

    .range-buttons .seg{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:.9rem;
    }

    .range-buttons .seg:hover{
      background:rgba(255,255,255,.05);
    }

    .range-buttons .seg.active{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.9);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
    }

    h3.section-title{
      text-align:center;
      font-size:1.6rem;
      margin-top:20px;
      margin-bottom:10px;
    }

    #gamesWrap{
      max-height:520px;
      overflow:auto;
      margin-top:12px;
    }

    table.games{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:1rem;
      table-layout:fixed;
    }

    table.games th,
    table.games td{
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      border-right:1px solid rgba(128,128,128,0.45);
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
    }

table.games th:first-child,
table.games td:first-child{
  border-left:1px solid rgba(128,128,128,0.45);
}

/* Separate groups of games when more than one calendar day is missing */
table.games tr.date-gap-before td{
  border-top:2px solid rgba(128,128,128,0.75);
}

    table.games th{
      position:sticky;
      top:0;
      z-index:2;
      background-color:var(--card, #161b22);
    }

    table.games th:nth-child(1),
    table.games td:nth-child(1){
      width:120px;
    }

table.games th:nth-child(2),
table.games td:nth-child(2),
table.games th:nth-child(4),
table.games td:nth-child(4){
  width:150px;
}

table.games th:nth-child(3),
table.games td:nth-child(3),
table.games th:nth-child(5),
table.games td:nth-child(5){
  width:64px;
}

table.games th:nth-child(6),
table.games td:nth-child(6){
  width:170px;
}

table.games th:nth-child(7),
table.games td:nth-child(7){
  width:78px;
}

table.games th:nth-child(8),
table.games td:nth-child(8){
  width:70px;
}

table.games th:nth-child(9),
table.games td:nth-child(9){
  width:70px;
}

    .player-cell{
      text-align:left;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player-cell a{
      color:inherit;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    .player-cell a:hover{
      opacity:.9;
    }

    .player-cell .profile-player,
    .player-cell a.profile-player{
      font-weight:900;
      text-decoration-thickness:2px;
    }

    .result{
      font-weight:800;
    }

    .result.win,
    .result-win{
      color:var(--wdl-win);
    }

    .result.draw,
    .result-draw{
      color:var(--wdl-draw);
    }

    .result.loss,
    .result-loss{
      color:var(--wdl-loss);
    }

    .delta{
      font-weight:800;
    }

    .delta.pos,
    .delta-pos{
      color:var(--wdl-win);
    }

    .delta.neg,
    .delta-neg{
      color:var(--wdl-loss);
    }

    .delta.zero,
    .delta-zero{
      color:var(--wdl-draw);
    }

    .wdl-cell{
      min-width:170px;
    }

.wdl-bar{
  display:flex;
  width:150px;
      height:26px;
      border-radius:7px;
      overflow:hidden;
      border:1px solid rgba(128,128,128,0.45);
      background:rgba(255,255,255,0.04);
      margin:0 auto;
    }

    .wdl-seg{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.76rem;
      font-weight:900;
      color:#111;
      overflow:hidden;
    }

    .wdl-win{
      background:var(--wdl-win);
    }

    .wdl-draw{
      background:var(--wdl-draw);
    }

    .wdl-loss{
      background:var(--wdl-loss);
    }

    .wdl-seg span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
    }

    @media (max-width:700px){
      .player-head{
        grid-template-columns:1fr;
        justify-items:start;
        align-items:flex-start;
      }

      h2#pname{
        text-align:left;
        font-size:1.6rem;
      }

      .player-rating-badge,
      .best-results-badge{
        justify-self:start;
      }

      h3.section-title{
        font-size:1.25rem;
      }

      table.games{
        font-size:.92rem;
      }

      table.games th,
      table.games td{
        padding:8px 10px;
      }

      table.games th:nth-child(1),
      table.games td:nth-child(1){
        width:110px;
      }

      table.games th:nth-child(2),
      table.games td:nth-child(2),
      table.games th:nth-child(4),
      table.games td:nth-child(4){
        width:145px;
      }

      table.games th:nth-child(3),
      table.games td:nth-child(3),
      table.games th:nth-child(5),
      table.games td:nth-child(5){
        width:68px;
      }

      table.games th:nth-child(6),
      table.games td:nth-child(6){
        width:150px;
      }

      table.games th:nth-child(7),
      table.games td:nth-child(7){
        width:85px;
      }

      table.games th:nth-child(8),
      table.games td:nth-child(8){
        width:75px;
      }

      table.games th:nth-child(9),
      table.games td:nth-child(9){
        width:75px;
      }

      .wdl-cell{
        min-width:132px;
      }

      .wdl-bar{
        width:132px;
        height:24px;
      }

      .wdl-seg{
        font-size:.68rem;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1><a href="index.html" style="color:#8b949e;text-decoration:none">J-Ratings</a></h1>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
  <div class="player-head">
    <div class="badge player-rating-badge">
      <button id="toggle" class="btn-mini" type="button" title="Toggle WCU overlay">Show WCU</button>

      <div class="stack">
        <div id="stats-j">
          <span class="muted">J Live:</span> <strong id="live-j">–</strong>
          <span class="muted">Peak:</span> <strong id="peak-j">–</strong>
          <span class="muted">K:</span> <strong id="kval-j">–</strong>
        </div>

        <div id="stats-wcu" style="display:none">
          <span class="muted">WCU Live:</span> <strong id="live-wcu">–</strong>
          <span class="muted">Peak:</span> <strong id="peak-wcu">–</strong>
          <span class="muted">K:</span> <strong id="kval-wcu">–</strong>
        </div>
      </div>
    </div>

    <h2 id="pname">Player</h2>

    <div class="badge best-results-badge" id="best-results">
      <div><span class="muted">Best Win:</span> <strong id="best-win">–</strong></div>
      <div><span class="muted">Best Draw:</span> <strong id="best-draw">–</strong></div>
    </div>
  </div>

    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <div>
        <label for="agg">View:</label>
        <select id="agg">
          <option value="daily">Daily</option>
          <option value="weekly" selected>Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div class="range-buttons">
        <button class="seg" data-range="ALL">ALL</button>
        <button class="seg" data-range="2015">2015–Present</button>
        <button class="seg" data-range="2022">2022–Present</button>
        <button class="seg" data-range="LY">Last Year</button>
        <button class="seg" data-range="YTD">YTD</button>
      </div>
    </div>

    <div id="chart"></div>

    <h3 class="section-title">Games</h3>

    <div id="gamesWrap">
      <table id="games" class="games">
        <thead>
          <tr>
            <th>Date</th>
            <th>Player</th>
            <th>Elo</th>
            <th>Opponent</th>
            <th>Elo</th>
            <th>Expected W/D/L</th>
            <th>Result</th>
            <th>Δ</th>
            <th>New</th>
          </tr>
        </thead>
        <tbody id="games-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');

if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL = 'data/players.json';
const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
const HIST_WCU    = id => `data/history/${encodeURIComponent(id)}_wcu.json`;
const GAMES_URL   = id => `data/games/${encodeURIComponent(id)}.json`;

const COLORS = {
  J: '#1f77b4',
  WCU: '#ff7f0e'
};

const kFromRating = r => (r >= 2200 ? 10 : r >= 1800 ? 20 : 30);

let me = null;
let playersAll = [];
let rawLive = [];
let rawWCU = [];
let seriesLive = null;
let seriesWCU = null;
let showWCU = false;
let dataMin = null;
let dataMax = null;
let initialRangeApplied = false;
let rememberedXRange = null;
let activeRangeKey = '2022';
let ratingByDate = Object.create(null);

const iso = d => new Date(d).toISOString().slice(0, 10);

function normalise(series) {
  return series
    .filter(p => p && p.x && Number.isFinite(+p.y))
    .map(p => ({ x: p.x, y: +p.y }))
    .sort((a, b) => new Date(a.x) - new Date(b.x));
}

function dateKey(s) {
  return (s || '').slice(0, 10);
}

function labelStepForRange(y0, y1) {
  const span = Math.abs(y1 - y0);
  if (span < 100) return 25;
  if (span < 300) return 50;
  return 100;
}

function setTickLabelsEvery(yMin, yMax, step) {
  const lo = Math.floor(yMin / step) * step;
  const hi = Math.ceil(yMax / step) * step;

  const vals = [];
  const text = [];

  for (let y = lo; y <= hi; y += step) {
    vals.push(y);
    text.push(String(y));
  }

  Plotly.relayout('chart', {
    'yaxis.tickmode': 'array',
    'yaxis.tickvals': vals,
    'yaxis.ticktext': text
  });
}

function aggregateExpanded(series, mode) {
  if (mode === 'daily') return normalise(series);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);
    let key;

    if (mode === 'weekly') {
      const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = tmp.getUTCDay() || 7;
      tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
      key = `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    } else if (mode === 'monthly') {
      key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    } else if (mode === 'quarterly') {
      const q = Math.floor(d.getMonth() / 3) + 1;
      key = `${d.getFullYear()}-Q${q}`;
    } else {
      key = `${d.getFullYear()}`;
    }

    (buckets[key] ||= []).push(+p.y);
  }

  const out = Object.keys(buckets).sort().map(k => {
    const ys = buckets[k].filter(Number.isFinite);
    const avg = ys.reduce((a, b) => a + b, 0) / ys.length;

    let x;

    if (k.includes('W')) {
      const [y, w] = k.split('-W');
      const year = +y;
      const week = +w;
      const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
      const dow = simple.getUTCDay();

      if (dow <= 4) simple.setUTCDate(simple.getUTCDate() - dow + 1);
      else simple.setUTCDate(simple.getUTCDate() + 8 - dow);

      x = iso(simple);
    } else if (k.includes('Q')) {
      const [y, q] = k.split('-Q');
      x = iso(new Date(Date.UTC(+y, (+q - 1) * 3, 1)));
    } else if (k.length === 7) {
      const [y, m] = k.split('-');
      x = iso(new Date(Date.UTC(+y, (+m) - 1, 1)));
    } else {
      x = iso(new Date(Date.UTC(+k, 0, 1)));
    }

    return { x, y: avg };
  });

  return normalise(out);
}

function makeTrace(series, name, colour) {
  return {
    x: series.map(p => p.x),
    y: series.map(p => p.y),
    mode: 'lines',
    line: {
      width: 3,
      shape: 'linear',
      color: colour
    },
    name,
    hovertemplate: '%{y:.0f}<extra>' + name + '</extra>',
    connectgaps: true
  };
}

function extentFrom(...seriesList) {
  const xs = [];

  for (const s of seriesList) {
    if (!s) continue;

    for (const p of s) {
      if (p?.x) xs.push(new Date(p.x));
    }
  }

  if (!xs.length) {
    return { min: null, max: null };
  }

  return {
    min: new Date(Math.min(...xs)),
    max: new Date(Math.max(...xs))
  };
}

function computeMetrics(series) {
  const y = series?.map(p => p.y) ?? [];
  const live = y.length ? Math.round(y[y.length - 1]) : null;
  const peak = y.length ? Math.round(Math.max(...y)) : null;
  const kval = Number.isFinite(live) ? kFromRating(live) : null;

  return { live, peak, kval };
}

function refreshBadge() {
  const j = computeMetrics(rawLive);

  document.getElementById('live-j').textContent = j.live ?? '–';
  document.getElementById('peak-j').textContent = j.peak ?? '–';
  document.getElementById('kval-j').textContent =
    (typeof me?.k === 'number') ? me.k : (j.kval ?? '–');

  const wcuRow = document.getElementById('stats-wcu');

  if (showWCU && rawWCU.length) {
    const w = computeMetrics(rawWCU);

    document.getElementById('live-wcu').textContent = w.live ?? '–';
    document.getElementById('peak-wcu').textContent = w.peak ?? '–';
    document.getElementById('kval-wcu').textContent = w.kval ?? '–';

    wcuRow.style.display = '';
  } else {
    wcuRow.style.display = 'none';
  }

  document.getElementById('toggle').textContent = showWCU ? 'Hide WCU' : 'Show WCU';
}

function clampRangeStartOnly(range) {
  if (!range || !dataMin) return range;

  const [x0, x1] = range.map(x => new Date(x));
  const lo = new Date(Math.max(+x0, +dataMin));

  return [iso(lo), iso(x1)];
}

function makePaddedEnd(start, endData) {
  const oneDay = 86400000;
  const spanMs = Math.max(oneDay, +endData - +start);
  const padMs = Math.max(3 * oneDay, Math.min(14 * oneDay, spanMs * 0.02));

  return new Date(+endData + padMs);
}

function updateActiveRangeButton() {
  document.querySelectorAll('.range-buttons .seg').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === activeRangeKey);
  });
}

function makeYGridShapes(yMin, yMax, step) {
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || !step) return [];

  const lo = Math.floor((yMin - 1) / step) * step;
  const hi = Math.ceil((yMax + 1) / step) * step;
  const shapes = [];

  for (let y = lo; y <= hi; y += step) {
    let width;
    let color;

    if (step === 100) {
      width = 2.2;
      color = 'rgba(255,255,255,0.28)';
    } else if (step === 50) {
      width = 1.4;
      color = 'rgba(255,255,255,0.16)';
    } else {
      width = 1.0;
      color = 'rgba(255,255,255,0.08)';
    }

    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      yref: 'y',
      y0: y,
      y1: y,
      line: { width, color }
    });
  }

  return shapes;
}

function adjustYToVisible(x0, x1) {
  const lo = new Date(x0);
  const hi = new Date(x1);
  const values = [];

  if (seriesLive?.length) {
    for (const p of seriesLive) {
      const d = new Date(p.x);
      if (d >= lo && d <= hi && Number.isFinite(p.y)) values.push(p.y);
    }
  }

  if (showWCU && seriesWCU?.length) {
    for (const p of seriesWCU) {
      const d = new Date(p.x);
      if (d >= lo && d <= hi && Number.isFinite(p.y)) values.push(p.y);
    }
  }

  if (!values.length) return;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || 10;
  const y0 = min - pad;
  const y1 = max + pad;
  const step = labelStepForRange(y0, y1);

  Plotly.relayout('chart', {
    'yaxis.range': [y0, y1],
    'shapes': makeYGridShapes(y0, y1, step)
  }).then(() => {
    setTickLabelsEvery(y0, y1, step);
  });
}

function draw() {
  const mode = document.getElementById('agg').value;
  const gd = document.getElementById('chart');
  const liveLayout = gd && gd._fullLayout ? gd._fullLayout.xaxis : null;

  if (liveLayout && liveLayout.range) {
    rememberedXRange = [liveLayout.range[0], liveLayout.range[1]];
  }

  seriesLive = aggregateExpanded(rawLive, mode);
  seriesWCU = rawWCU.length ? aggregateExpanded(rawWCU, mode) : null;

  const traces = [makeTrace(seriesLive, 'J-Ratings', COLORS.J)];

  if (showWCU && seriesWCU) {
    traces.push(makeTrace(seriesWCU, 'WCU', COLORS.WCU));
  }

  const ext = extentFrom(seriesLive, seriesWCU);
  dataMin = ext.min;
  dataMax = ext.max;

  const allY = [];

  for (const p of seriesLive || []) {
    if (Number.isFinite(p.y)) allY.push(p.y);
  }

  if (showWCU && seriesWCU) {
    for (const p of seriesWCU) {
      if (Number.isFinite(p.y)) allY.push(p.y);
    }
  }

  const yMin0 = allY.length ? Math.min(...allY) : 0;
  const yMax0 = allY.length ? Math.max(...allY) : 1;
  const bg = getComputedStyle(document.body).backgroundColor;

  const baseLayout = {
    margin: { l: 50, r: 28, t: 10, b: 40 },

    xaxis: {
      type: 'date',
      fixedrange: true,
      showgrid: false,
      rangeslider: { visible: false }
    },

    yaxis: {
      title: '',
      fixedrange: true,
      showgrid: false,
      zeroline: false,
      tick0: 0,
      dtick: 25,
      ticks: 'outside',
      ticklen: 4,
      tickmode: 'array',
      tickvals: [],
      ticktext: []
    },

    paper_bgcolor: bg,
    plot_bgcolor: bg,
    font: { color: getComputedStyle(document.body).color },
    legend: { orientation: 'h', x: 0, y: 1.1 },
    shapes: makeYGridShapes(yMin0, yMax0, 100)
  };

  if (!initialRangeApplied && dataMin && dataMax) {
    const rawStart = new Date('2022-01-01');
    const start = new Date(Math.max(+rawStart, +dataMin));
    const end = makePaddedEnd(start, dataMax);

    rememberedXRange = [iso(start), iso(end)];
    activeRangeKey = '2022';
    initialRangeApplied = true;
  }

  Plotly.react('chart', traces, baseLayout, {
    staticPlot: false,
    scrollZoom: false,
    displayModeBar: false,
    responsive: true
  }).then(() => {
    if (rememberedXRange) {
      const [x0, x1] = clampRangeStartOnly(rememberedXRange);
      rememberedXRange = [x0, x1];

      Plotly.relayout('chart', { 'xaxis.range': [x0, x1] })
        .then(() => adjustYToVisible(x0, x1));
    }

    updateActiveRangeButton();

    const gd2 = document.getElementById('chart');

    if (!gd2._jrHandlersAttached) {
      gd2.on('plotly_relayout', ev => {
        const x0 = ev['xaxis.range[0]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][0]);
        const x1 = ev['xaxis.range[1]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][1]);

        if (x0 && x1) {
          rememberedXRange = [x0, x1];
          adjustYToVisible(x0, x1);
        }
      });

      gd2._jrHandlersAttached = true;
    }
  });
}

function getId(g, base) {
  return g[base + 'Id'] ?? g[base + '_id'] ?? g[base + 'ID'] ?? null;
}

function resultClass(r) {
  if (r === 'Win') return 'result win';
  if (r === 'Draw') return 'result draw';
  if (r === 'Loss') return 'result loss';
  return 'result';
}

function deltaClass(d) {
  if (!d) return 'delta';
  if (String(d).startsWith('+')) return 'delta pos';
  if (String(d).startsWith('-')) return 'delta neg';
  return 'delta zero';
}

function parseDelta(deltaVal) {
  if (deltaVal == null) return null;

  if (typeof deltaVal === 'number' && Number.isFinite(deltaVal)) {
    return deltaVal;
  }

  if (typeof deltaVal === 'string') {
    const x = parseFloat(deltaVal);
    return Number.isFinite(x) ? x : null;
  }

  return null;
}

function ratingOnOrBefore(dateStr) {
  if (!dateStr) return null;

  const key = dateStr.slice(0, 10);

  if (Object.prototype.hasOwnProperty.call(ratingByDate, key)) {
    return ratingByDate[key];
  }

  const target = new Date(key);
  let best = null;

  for (const p of rawLive) {
    if (!p || !p.x) continue;

    const d = new Date(p.x);

    if (d <= target && (!best || d > best.d)) {
      best = { d, r: p.y };
    }
  }

  return best ? best.r : null;
}

function computeGameNewRaw(g) {
  if (g.new != null && Number.isFinite(+g.new)) return +g.new;
  if (g.playerNew != null && Number.isFinite(+g.playerNew)) return +g.playerNew;

  const playerElo =
    (g.playerElo != null && Number.isFinite(+g.playerElo))
      ? +g.playerElo
      : null;

  const delta = parseDelta(g.delta);

  if (playerElo != null && delta != null) {
    return playerElo + delta;
  }

  return null;
}

function drawRateFromGap(absGap) {
  const maxDraw = 0.33;
  const scale = 360;
  const shape = 1.45;

  return maxDraw * Math.exp(-Math.pow(absGap / scale, shape));
}

function expectedWdlFromElo(playerElo, opponentElo) {
  const expected = 1 / (1 + Math.pow(10, (opponentElo - playerElo) / 400));
  const absGap = Math.abs(playerElo - opponentElo);

  let drawProb = drawRateFromGap(absGap);
  const maxAllowedDraw = 2 * Math.min(expected, 1 - expected);

  drawProb = Math.min(drawProb, maxAllowedDraw);

  let winProb = expected - drawProb / 2;
  let lossProb = 1 - expected - drawProb / 2;

  winProb = Math.max(0, Math.min(1, winProb));
  drawProb = Math.max(0, Math.min(1, drawProb));
  lossProb = Math.max(0, Math.min(1, lossProb));

  const total = winProb + drawProb + lossProb;

  return {
    win: Math.round(100 * winProb / total),
    draw: Math.round(100 * drawProb / total),
    loss: Math.round(100 * lossProb / total)
  };
}

function renderWdlBar(g) {
  let win = Number(g.winPct);
  let draw = Number(g.drawPct);
  let loss = Number(g.lossPct);

  if (!Number.isFinite(win) || !Number.isFinite(draw) || !Number.isFinite(loss)) {
    const playerElo = Number(g.playerElo);
    const opponentElo = Number(g.opponentElo);

    if (!Number.isFinite(playerElo) || !Number.isFinite(opponentElo)) {
      return document.createTextNode('');
    }

    const calc = expectedWdlFromElo(playerElo, opponentElo);

    win = calc.win;
    draw = calc.draw;
    loss = calc.loss;
  }

let safeWin = Math.max(0, Math.min(100, Math.round(win)));
let safeDraw = Math.max(0, Math.min(100, Math.round(draw)));
let safeLoss = Math.max(0, Math.min(100, Math.round(loss)));

const totalPct = safeWin + safeDraw + safeLoss;

if (totalPct !== 100) {
  const diff = 100 - totalPct;

  if (safeWin >= safeDraw && safeWin >= safeLoss) {
    safeWin += diff;
  } else if (safeDraw >= safeWin && safeDraw >= safeLoss) {
    safeDraw += diff;
  } else {
    safeLoss += diff;
  }
}

  const wrap = document.createElement('div');
  wrap.className = 'wdl-bar';
  wrap.title = `Win ${safeWin}% / Draw ${safeDraw}% / Loss ${safeLoss}%`;

  const winSeg = document.createElement('div');
  winSeg.className = 'wdl-seg wdl-win';
  winSeg.style.width = `${safeWin}%`;
  winSeg.innerHTML = `<span>${safeWin}%</span>`;

  const drawSeg = document.createElement('div');
  drawSeg.className = 'wdl-seg wdl-draw';
  drawSeg.style.width = `${safeDraw}%`;
  drawSeg.innerHTML = `<span>${safeDraw}%</span>`;

  const lossSeg = document.createElement('div');
  lossSeg.className = 'wdl-seg wdl-loss';
  lossSeg.style.width = `${safeLoss}%`;
  lossSeg.innerHTML = `<span>${safeLoss}%</span>`;

  wrap.appendChild(winSeg);
  wrap.appendChild(drawSeg);
  wrap.appendChild(lossSeg);

  return wrap;
}

function renderPlayerCell(playerId, playerName, isProfilePlayer) {
  const tdContent = document.createDocumentFragment();
  const label = playerName || '';

  if (playerId) {
    const a = document.createElement('a');
    a.href = `player.html?id=${encodeURIComponent(playerId)}`;
    a.textContent = label;

    if (isProfilePlayer) {
      a.className = 'profile-player';
    }

    tdContent.appendChild(a);
  } else {
    const span = document.createElement('span');
    span.textContent = label;

    if (isProfilePlayer) {
      span.className = 'profile-player';
    }

    tdContent.appendChild(span);
  }

  return tdContent;
}

function refreshBestResults(games) {
  let bestWin = null;
  let bestDraw = null;

  for (const g of games) {
    const oppElo = Number(g.opponentElo);

    if (!Number.isFinite(oppElo) || oppElo < 500) continue;

    if (g.result === 'Win') {
      if (!bestWin || oppElo > bestWin.elo) {
        bestWin = { elo: oppElo, opponent: g.opponent || '', date: g.date || '' };
      }
    }

    if (g.result === 'Draw') {
      if (!bestDraw || oppElo > bestDraw.elo) {
        bestDraw = { elo: oppElo, opponent: g.opponent || '', date: g.date || '' };
      }
    }
  }

  document.getElementById('best-win').textContent =
    bestWin ? `${Math.round(bestWin.elo)} (${bestWin.opponent})` : '–';

  document.getElementById('best-draw').textContent =
    bestDraw ? `${Math.round(bestDraw.elo)} (${bestDraw.opponent})` : '–';
}

function renderGamesTable(games) {
  const tbody = document.getElementById('games-body');
  tbody.innerHTML = '';

let added = 0;
let previousRenderedDate = null;

for (const g of games) {
  if (
    g.opponentElo != null &&
    Number.isFinite(+g.opponentElo) &&
    +g.opponentElo < 500
  ) {
    continue;
  }

  const tr = document.createElement('tr');
  const currentDate = dateKey(g.date);

  if (previousRenderedDate && currentDate) {
    const previousTime = Date.parse(`${previousRenderedDate}T00:00:00Z`);
    const currentTime = Date.parse(`${currentDate}T00:00:00Z`);
    const differenceInDays =
      Math.abs(previousTime - currentTime) / 86400000;

    if (differenceInDays > 2) {
      tr.classList.add('date-gap-before');
    }
  }

  if (currentDate) {
    previousRenderedDate = currentDate;
  }

    const playerName = g.player || me?.name || '';
    const playerId = g.playerId || me?.id || idRaw;

    const opponentName = g.opponent || '';
    const opponentId = getId(g, 'opponent');

    const playerElo = Number(g.playerElo);
    const opponentElo = Number(g.opponentElo);

    const cells = [];

    const tdDate = document.createElement('td');
    tdDate.textContent = g.date || '';
    cells.push(tdDate);

    const tdPlayer = document.createElement('td');
    tdPlayer.className = 'player-cell';
    tdPlayer.appendChild(renderPlayerCell(playerId, playerName, true));
    cells.push(tdPlayer);

    const tdPlayerElo = document.createElement('td');
    tdPlayerElo.textContent = Number.isFinite(playerElo) ? String(Math.round(playerElo)) : '';
    cells.push(tdPlayerElo);

    const tdOpponent = document.createElement('td');
    tdOpponent.className = 'player-cell';
    tdOpponent.appendChild(renderPlayerCell(opponentId, opponentName, false));
    cells.push(tdOpponent);

    const tdOpponentElo = document.createElement('td');
    tdOpponentElo.textContent = Number.isFinite(opponentElo) ? String(Math.round(opponentElo)) : '';
    cells.push(tdOpponentElo);

    const tdWdl = document.createElement('td');
    tdWdl.className = 'wdl-cell';
    tdWdl.appendChild(renderWdlBar(g));
    cells.push(tdWdl);

    const tdResult = document.createElement('td');
    tdResult.textContent = g.result || '';
    tdResult.className = resultClass(g.result);
    cells.push(tdResult);

    const tdDelta = document.createElement('td');
    tdDelta.textContent = g.delta ?? '';
    tdDelta.className = deltaClass(g.delta);
    cells.push(tdDelta);

const tdNew = document.createElement('td');
tdNew.textContent = Number.isFinite(g.jNew) ? String(g.jNew) : '';
cells.push(tdNew);

    for (const td of cells) {
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
    added++;
  }

  if (!added) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = 9;
    td.textContent = 'No games';

    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

async function load() {
  try {
    document.getElementById('games-body').innerHTML =
      '<tr><td colspan="9">Loading…</td></tr>';

    const [playersRes, liveRes, wcuRes, gamesRes] = await Promise.all([
      fetch(PLAYERS_URL, { cache: 'no-cache' }),
      fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
      fetch(HIST_WCU(idRaw), { cache: 'no-cache' }).catch(() => null),
      fetch(GAMES_URL(idRaw), { cache: 'no-cache' }).catch(() => null)
    ]);

    if (!playersRes.ok) throw new Error('players.json not found');
    if (!liveRes.ok) throw new Error('live history not found');

    playersAll = await playersRes.json();
    me = playersAll.find(p => p.id === idRaw);

    if (!me) throw new Error('player id not in players.json');

    document.getElementById('pname').textContent = me.name;

    const liveData = await liveRes.json();

    rawLive = liveData
      .map(d => ({ x: d.date, y: +d.rating }))
      .filter(p => Number.isFinite(p.y));

    ratingByDate = Object.create(null);

    for (const d of liveData) {
      const key = (d.date || '').slice(0, 10);
      const val = +d.rating;

      if (Number.isFinite(val)) {
        ratingByDate[key] = val;
      }
    }

    if (wcuRes && wcuRes.ok) {
      rawWCU = (await wcuRes.json())
        .map(d => ({ x: d.date, y: +d.rating }))
        .filter(p => Number.isFinite(p.y));

      document.getElementById('toggle').disabled = false;
    } else {
      rawWCU = [];
      document.getElementById('toggle').disabled = true;
      document.getElementById('toggle').textContent = 'WCU N/A';
    }

    draw();
    refreshBadge();

    document.getElementById('agg').addEventListener('change', () => {
      draw();
      refreshBadge();
    });

    document.querySelectorAll('.range-buttons .seg').forEach(btn => {
      btn.addEventListener('click', () => setPreset(btn.dataset.range));
    });

if (gamesRes && gamesRes.ok) {
  const games = await gamesRes.json();

  refreshBestResults(games);

  games.forEach((g, idx) => {
        g.__i = idx;
      });

      for (const g of games) {
        g._jNewRaw = computeGameNewRaw(g);
        g.jNew = Number.isFinite(g._jNewRaw) ? Math.round(g._jNewRaw) : null;
      }

      games.sort((a, b) => {
        const da = dateKey(a.date);
        const db = dateKey(b.date);

        if (da !== db) return db.localeCompare(da);

        const ga = Number.isFinite(+a.gi) ? +a.gi : 0;
        const gb = Number.isFinite(+b.gi) ? +b.gi : 0;

        return gb - ga;
      });

      renderGamesTable(games);
    } else {
      document.getElementById('games-body').innerHTML =
        '<tr><td colspan="9">No games</td></tr>';
    }
  } catch (e) {
    console.error(e);

    document.getElementById('chart').textContent = 'No Games';
    document.getElementById('games-body').innerHTML =
      '<tr><td colspan="9">Error loading games</td></tr>';
  }
}

function setPreset(key) {
  if (!dataMin || !dataMax) return;

  let start;

  if (key === 'ALL') {
    start = new Date(dataMin);
  } else if (key === '2015') {
    start = new Date('2015-01-01');
  } else if (key === '2022') {
    start = new Date('2022-01-01');
  } else if (key === 'LY') {
    start = new Date(dataMax);
    start.setFullYear(start.getFullYear() - 1);
  } else if (key === 'YTD') {
    start = new Date(dataMax.getFullYear() + '-01-01');
  } else {
    start = new Date(dataMin);
  }

  start = new Date(Math.max(+start, +dataMin));

  const end = makePaddedEnd(start, dataMax);
  const range = [iso(start), iso(end)];

  rememberedXRange = range;
  activeRangeKey = key;

  updateActiveRangeButton();

  Plotly.relayout('chart', { 'xaxis.range': range })
    .then(() => adjustYToVisible(range[0], range[1]));
}

document.addEventListener('click', e => {
  if (e.target.id === 'toggle' && !e.target.disabled) {
    showWCU = !showWCU;
    draw();
    refreshBadge();
  }
});

load();
</script>
