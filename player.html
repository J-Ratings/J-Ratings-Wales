<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    .player-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin:12px 0;
      padding-right:12px;
    }
    .badge{
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:8px;
      padding:6px 10px;
      margin-right:4px;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:.75rem;
    }
    .badge .stack {
      display: grid;
      grid-template-columns: auto auto auto auto auto auto;
      column-gap: .35rem;
    }
    .badge .stack div {
      display: contents;
    }
    .badge strong {
      font-variant-numeric: tabular-nums;
    }
    .btn-mini{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      padding:4px 8px;
      border-radius:6px;
      cursor:pointer;
      font-size:.9rem;
    }
    .btn-mini[disabled]{opacity:.5; cursor:default}
    .btn-mini:hover:not([disabled]){background:rgba(255,255,255,.05)}
    #chart{
      height:420px;
      touch-action: pan-y; /* Allow vertical scroll, not pinch zoom */
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1><a href="index.html" style="color:#8b949e;text-decoration:none">J-Ratings</a></h1>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <h2 id="pname">Player</h2>
      <div class="badge">
        <button id="toggle" class="btn-mini" type="button" title="Toggle WCU overlay">Show WCU</button>
        <div class="stack">
          <div id="stats-j">
            <span class="muted">J Live:</span> <strong id="live-j">–</strong>
            <span class="muted">Peak:</span> <strong id="peak-j">–</strong>
            <span class="muted">K:</span> <strong id="kval-j">–</strong>
          </div>
          <div id="stats-wcu" style="display:none">
            <span class="muted">WCU Live:</span> <strong id="live-wcu">–</strong>
            <span class="muted">Peak:</span> <strong id="peak-wcu">–</strong>
            <span class="muted">K:</span> <strong id="kval-wcu">–</strong>
          </div>
        </div>
      </div>
    </div>

    <div id="chart"></div>
  </section>
</main>

<script>
  // ---- Inputs & helpers ---------------------------------------------------
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing player id.';
    throw new Error('no id');
  }

  const PLAYERS_URL = 'data/players.json';
  const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;       // J-Ratings series
  const HIST_WCU    = id => `data/history/${encodeURIComponent(id)}_wcu.json`;   // WCU series (site "New")

  const kFromRating = r => (r >= 2200 ? 10 : r >= 1800 ? 20 : 30);

  // ---- State --------------------------------------------------------------
  let me = null;
  let seriesLive = null; // J
  let seriesWCU  = null; // WCU
  let showWCU    = false; // default: J only
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  // ---- Rendering ----------------------------------------------------------
  function makeTrace(series, name){
    return {
      x: series.x,
      y: series.y,
      mode: 'lines',
      line: { width: 2, shape: 'hv' }, // step line: flat between games
      name,
      hovertemplate: '%{x}<br>%{y}<extra>' + name + '</extra>'
    };
  }

  function draw(){
    const bg = getComputedStyle(document.body).backgroundColor;
    const traces = [ makeTrace(seriesLive, 'J-Ratings') ];
    if (showWCU && seriesWCU) traces.push(makeTrace(seriesWCU, 'WCU'));

    Plotly.newPlot('chart', traces, {
      margin:{ l:50, r:20, t:10, b:40 },
      xaxis:{ type:'date' },
      yaxis:{ title:'Rating' },
      paper_bgcolor:bg,
      plot_bgcolor:bg,
      font:{ color:getComputedStyle(document.body).color },
      legend:{ orientation:'h', x:0, y:1.1 }
    }, { 
      staticPlot: IS_TOUCH,  // static on touch devices
      scrollZoom: false,
      displayModeBar:false, 
      responsive:true 
    });
  }

  function computeMetrics(series){
    const y = series?.y ?? [];
    const live = y.length ? Math.round(y[y.length - 1]) : null;
    const peak = y.length ? Math.round(Math.max(...y)) : null;
    const kval = Number.isFinite(live) ? kFromRating(live) : null;
    return { live, peak, kval };
  }

  function refreshBadge(){
    // J line always shown in badge
    const j = computeMetrics(seriesLive);
    document.getElementById('live-j').textContent = j.live ?? '–';
    document.getElementById('peak-j').textContent = j.peak ?? '–';
    const kvalJ = (typeof me?.k === 'number') ? me.k : (j.kval ?? '–');
    document.getElementById('kval-j').textContent = kvalJ;

    // WCU row appears only when overlay is visible
    const wcuRow = document.getElementById('stats-wcu');
    if (showWCU && seriesWCU) {
      const w = computeMetrics(seriesWCU);
      document.getElementById('live-wcu').textContent = w.live ?? '–';
      document.getElementById('peak-wcu').textContent = w.peak ?? '–';
      document.getElementById('kval-wcu').textContent = w.kval ?? '–';
      wcuRow.style.display = '';
    } else {
      wcuRow.style.display = 'none';
    }

    document.getElementById('toggle').textContent = showWCU ? 'Hide WCU' : 'Show WCU';
  }

  // ---- Data loading -------------------------------------------------------
  async function load(){
    try {
      const [playersRes, liveRes, wcuRes] = await Promise.all([
        fetch(PLAYERS_URL, { cache:'no-cache' }),
        fetch(HIST_URL(idRaw), { cache:'no-cache' }),
        fetch(HIST_WCU(idRaw), { cache:'no-cache' }).catch(() => null)
      ]);
      if (!playersRes.ok) throw new Error('players.json not found');
      if (!liveRes.ok)    throw new Error('live history not found');

      const players = await playersRes.json();
      me = players.find(p => p.id === idRaw);
      if (!me) throw new Error('player id not in players.json');
      document.getElementById('pname').textContent = me.name;

      const livePairs = (await liveRes.json())
        .map(d => ({ x: d.date, y: Number(d.rating) }))
        .filter(p => Number.isFinite(p.y));
      seriesLive = { x: livePairs.map(p => p.x), y: livePairs.map(p => p.y) };

      if (wcuRes && wcuRes.ok) {
        const wcuPairs = (await wcuRes.json())
          .map(d => ({ x: d.date, y: Number(d.rating) }))
          .filter(p => Number.isFinite(p.y));
        seriesWCU = { x: wcuPairs.map(p => p.x), y: wcuPairs.map(p => p.y) };
        document.getElementById('toggle').disabled = false;
      } else {
        document.getElementById('toggle').disabled = true;
        document.getElementById('toggle').textContent = 'WCU N/A';
      }

      draw();         // J only to start
      refreshBadge(); // badge from J

    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'No Games';
    }
  }

  // ---- Events -------------------------------------------------------------
  document.addEventListener('click', e => {
    if (e.target.id === 'toggle' && !e.target.disabled) {
      showWCU = !showWCU; // overlay on/off
      draw();
      refreshBadge();
    }
  });

  load();
</script>
</body>
</html>
