<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    #chart { height: 420px; }
    .toolbar { margin-bottom: 10px; text-align: center; }
    .toolbar label { margin-right: 6px; }
    h2#pname { margin-bottom: 10px; }

    /* Key styling */
    #badge {
      position:absolute; top:12px; right:12px;
      background:#111; border-radius:6px; padding:6px 12px;
      font-size:14px; line-height:1.4;
      display:flex; gap:20px; /* side by side */
    }
    #badge .col { display:flex; flex-direction:column; }
    #badge .label { font-weight:600; }
    #badge .j { color:#1f77b4; }
    #badge .wcu { color:#ff7f0e; }

    /* Games table */
    #gamesWrap { max-height: 520px; overflow: auto; margin-top: 12px; }
    table.games {
      width:100%; border-collapse: collapse; font-size:14px;
    }
    table.games th, table.games td {
      padding:6px 8px; border-bottom:1px solid #2b2f36;
      text-align:center; white-space: nowrap;
    }
    table.games th { position: sticky; top: 0; background:#1a1a1a; }
    .result.win { color:#2e7d32; font-weight:700; }
    .result.loss{ color:#c62828; font-weight:700; }
    .delta.pos { color:#2e7d32; font-weight:700; }
    .delta.neg { color:#c62828; font-weight:700; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-title"><a href="index.html">J-Ratings</a></h1>
    <nav class="topnav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="compare.html">Compare</a>
      <a href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" style="position:relative">
    <h2 id="pname">Player</h2>
    <div class="toolbar">
      <label for="agg">View:</label>
      <select id="agg">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <div id="chart">Loading…</div>
    <div id="badge">
      <div class="col j">
        <span class="label">J Live: <span id="j-live"></span></span>
        <span>Peak: <span id="j-peak"></span></span>
        <span>K: <span id="j-k"></span></span>
      </div>
      <div class="col wcu">
        <span class="label">WCU Live: <span id="wcu-live"></span></span>
        <span>Peak: <span id="wcu-peak"></span></span>
        <span>K: <span id="wcu-k"></span></span>
        <button id="toggle">Hide WCU</button>
      </div>
    </div>

    <h3 class="section-title" style="margin-top:18px;">Games</h3>
    <div id="gamesWrap"><table id="games" class="games"></table></div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');
if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL='data/players.json';
const HIST_URL=id=>`data/history/${encodeURIComponent(id)}.json`;
const HIST_WCU=id=>`data/history_wcu/${encodeURIComponent(id)}.json`;
const GAMES_URL=id=>`data/games/${encodeURIComponent(id)}.json`;
const IS_TOUCH=window.matchMedia('(pointer: coarse)').matches;

let RAW=[], RAW_WCU=[];

function normalise(series, dedupeByDay=false){
  const s=series
    .filter(p=>p && p.x && Number.isFinite(p.y))
    .map(p=>({x:p.x,y:+p.y}))
    .sort((a,b)=>new Date(a.x)-new Date(b.x));
  if(!dedupeByDay) return s;
  const out=[]; let lastKey=null;
  for(const p of s){
    const d=new Date(p.x);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(key!==lastKey) out.push(p);
    else out[out.length-1]=p;
    lastKey=key;
  }
  return out;
}

function aggregateExpanded(series, mode){
  if(mode==='daily') return normalise(series,true);

  const buckets={};
  for(const p of series){
    const d=new Date(p.x); let key;
    if(mode==='weekly'){
      const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
      const dayNum=tmp.getUTCDay()||7;
      tmp.setUTCDate(tmp.getUTCDate()+4-dayNum);
      const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
      const weekNo=Math.ceil((((tmp-yearStart)/86400000)+1)/7);
      key=`${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
    }else if(mode==='monthly'){
      key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }else if(mode==='yearly'){
      key=`${d.getFullYear()}`;
    }
    (buckets[key] ||= []).push(p.y);
  }

  return Object.keys(buckets).sort().map(k=>{
    const ys=buckets[k].filter(Number.isFinite);
    const avg=ys.reduce((a,b)=>a+b,0)/ys.length;
    let x;
    if(k.includes('W')){
      const [y,w]=k.split('-W'); const year=+y, week=+w;
      const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
      const dow=simple.getUTCDay();
      if(dow<=4) simple.setUTCDate(simple.getUTCDate()-dow+1);
      else simple.setUTCDate(simple.getUTCDate()+8-dow);
      x=simple.toISOString().slice(0,10);
    }else if(k.length===7){ x=`${k}-01`; }
    else { x=`${k}-01-01`; }
    return {x,y:avg};
  });
}

function draw(mode){
  const el=document.getElementById('chart');
  if(el.textContent.includes('Loading')) el.textContent='';

  const dataJ=aggregateExpanded(RAW,mode);
  const dataW=aggregateExpanded(RAW_WCU,mode);
  if(!dataJ.length && !dataW.length){ el.textContent='No games'; return; }

  const traces=[];
  if(dataJ.length){
    traces.push({
      type:'scatter', x:dataJ.map(p=>p.x), y:dataJ.map(p=>p.y),
      mode:(mode==='daily')?'lines':'lines+markers',
      line:{width:2,shape:'linear',color:'#1f77b4'},
      marker:(mode==='daily')?{size:0}:{size:4},
      hovertemplate:'%{x}<br>%{y:.0f}<extra></extra>',
      name:'J-Ratings'
    });
  }
  if(dataW.length){
    traces.push({
      type:'scatter', x:dataW.map(p=>p.x), y:dataW.map(p=>p.y),
      mode:(mode==='daily')?'lines':'lines+markers',
      line:{width:2,shape:'linear',color:'#ff7f0e'},
      marker:(mode==='daily')?{size:0}:{size:4},
      hovertemplate:'%{x}<br>%{y:.0f}<extra></extra>',
      name:'WCU'
    });
  }

  const bg=getComputedStyle(document.body).backgroundColor;
  Plotly.newPlot('chart', traces, {
    margin:{l:50,r:20,t:10,b:40},
    xaxis:{type:'date'}, yaxis:{title:'Rating'},
    paper_bgcolor:bg, plot_bgcolor:bg,
    font:{color:getComputedStyle(document.body).color}
  },{
    staticPlot:IS_TOUCH, displayModeBar:false, responsive:true
  });
}

async function load(){
  try{
    const [playersRes,liveRes,wcuRes,gamesRes]=await Promise.all([
      fetch(PLAYERS_URL,{cache:'no-cache'}),
      fetch(HIST_URL(idRaw),{cache:'no-cache'}),
      fetch(HIST_WCU(idRaw),{cache:'no-cache'}).catch(()=>null),
      fetch(GAMES_URL(idRaw),{cache:'no-cache'}).catch(()=>null)
    ]);
    if(!playersRes.ok) throw new Error('players.json not found');
    if(!liveRes.ok) throw new Error('live history not found');

    const players=await playersRes.json();
    const me=players.find(p=>p.id===idRaw);
    if(!me) throw new Error('player id not in players.json');
    document.getElementById('pname').textContent=me.name;

    RAW=normalise((await liveRes.json()).map(d=>({x:d.date,y:+d.rating})),true);
    if(wcuRes&&wcuRes.ok){
      RAW_WCU=normalise((await wcuRes.json()).map(d=>({x:d.date,y:+d.rating})),true);
      document.getElementById('toggle').disabled=false;
    }else{
      RAW_WCU=[];
      document.getElementById('toggle').disabled=true;
      document.getElementById('toggle').textContent='WCU N/A';
    }

    const initialMode='monthly';
    document.getElementById('agg').value=initialMode;
    draw(initialMode);
    document.getElementById('agg').addEventListener('change',e=>draw(e.target.value));

    // badge numbers
    if(RAW.length){
      document.getElementById('j-live').textContent=Math.round(RAW.at(-1).y);
      document.getElementById('j-peak').textContent=Math.round(Math.max(...RAW.map(p=>p.y)));
      document.getElementById('j-k').textContent=20;
    }
    if(RAW_WCU.length){
      document.getElementById('wcu-live').textContent=Math.round(RAW_WCU.at(-1).y);
      document.getElementById('wcu-peak').textContent=Math.round(Math.max(...RAW_WCU.map(p=>p.y)));
      document.getElementById('wcu-k').textContent=20;
    }

    if(gamesRes&&gamesRes.ok){
      const games=await gamesRes.json();
      renderGamesTable(games);
    }else{
      document.getElementById('games').innerHTML='<tbody><tr><td>No games</td></tr></tbody>';
    }
  }catch(e){
    console.error(e);
    document.getElementById('chart').textContent='Error: '+e.message;
  }
}

function renderGamesTable(games){
  const tbl=document.getElementById('games');
  tbl.innerHTML='';
  const thead=document.createElement('thead');
  const hr=document.createElement('tr');
  for(const h of ['Date','Opponent','Result','Δ']){
    const th=document.createElement('th'); th.textContent=h; hr.appendChild(th);
  }
  thead.appendChild(hr); tbl.appendChild(thead);
  const tbody=document.createElement('tbody');
  games.sort((a,b)=>new Date(b.date)-new Date(a.date));
  for(const g of games){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${g.date}</td>
                  <td>${g.opponent??''}</td>
                  <td class="result ${g.result==='1'?'win':'loss'}">${g.result}</td>
                  <td class="delta ${(g.delta>0)?'pos':(g.delta<0?'neg':'')}">${g.delta??''}</td>`;
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
}

load();
</script>
</body>
</html>
