<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    /* Strip the mini-graph out of the Plotly range slider */
    #chart g.rangeslider .plot,
    #chart g.rangeslider .rangeplot {
      opacity: 0 !important;       /* hides all the tiny traces at once */
    }

    /* Hide axes and grid inside the rangeslider */
    #chart g.rangeslider .gridlayer,
    #chart g.rangeslider .zerolinelayer,
    #chart g.rangeslider [class^="xaxislayer"],
    #chart g.rangeslider [class^="yaxislayer"] {
      display: none !important;
    }

    .player-head{
      display:flex;justify-content:space-between;align-items:flex-end;
      margin:12px 0;padding-right:12px;
    }
    .badge{
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:8px;
      padding:6px 10px;
      margin-right:4px;
      white-space:nowrap;
      display:flex;
      align-items:flex-start;
      flex-direction:column;
      gap:.5rem;
    }
    .badge .stack{display:flex;flex-direction:column;gap:.25rem;}
    .badge strong{font-variant-numeric:tabular-nums;}

    #stats-j .muted{color:#1f77b4;font-weight:bold;}
    #stats-wcu .muted{color:#ff7f0e;font-weight:bold;}

    .btn-mini{
      background:#0f1623;border:1px solid var(--border);color:var(--text);
      padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.9rem;
    }
    .btn-mini[disabled]{opacity:.5;cursor:default;}
    .btn-mini:hover:not([disabled]){background:rgba(255,255,255,05);}

    #chart{height:420px;touch-action:pan-y;}

    .range-buttons{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0 0.25rem 0;}
    .range-buttons .seg{
      background:#0f1623;border:1px solid var(--border);color:var(--text);
      padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem;
    }
    .range-buttons .seg:hover{background:rgba(255,255,255,05);}

    #games{margin-top:1.5rem;width:100%;border-collapse:collapse;}
    #games th,#games td{
      padding:6px 10px;border-bottom:1px solid #333;text-align:center!important;
      vertical-align:middle;white-space:nowrap;border-right:3px double rgba(255,255,255,0.25);
    }
    #games th:last-child,#games td:last-child{border-right:none;}
    #games th:nth-child(6),#games td:nth-child(6){border-right:3px double rgba(128,128,128,0.6)}
    .result-win{color:#34c759;font-weight:bold}
    .result-draw{color:#ffb833;font-weight:bold}
    .result-loss{color:#e53935;font-weight:bold}
    .delta-pos{color:#34c759;font-weight:bold}
    .delta-neg{color:#e53935;font-weight:bold}
    .delta-zero{color:#ffb833;font-weight:bold}
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1><a href="index.html" style="color:#8b949e;text-decoration:none">J-Ratings</a></h1>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <h2 id="pname">Player</h2>
      <div class="badge">
        <button id="toggle" class="btn-mini" type="button" title="Toggle WCU overlay">Show WCU</button>
        <div class="stack">
          <div id="stats-j">
            <span class="muted">J Live:</span> <strong id="live-j">–</strong>
            <span class="muted">Peak:</span> <strong id="peak-j">–</strong>
            <span class="muted">K:</span> <strong id="kval-j">–</strong>
          </div>
          <div id="stats-wcu" style="display:none">
            <span class="muted">WCU Live:</span> <strong id="live-wcu">–</strong>
            <span class="muted">Peak:</span> <strong id="peak-wcu">–</strong>
            <span class="muted">K:</span> <strong id="kval-wcu">–</strong>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <div>
        <label for="agg">View:</label>
        <select id="agg">
          <option value="daily" selected>Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div class="range-buttons">
        <button class="seg" data-range="ALL">ALL</button>
        <button class="seg" data-range="2015">2015–Present</button>
        <button class="seg" data-range="2022">2022–Present</button>
        <button class="seg" data-range="LY">Last Year</button>
        <button class="seg" data-range="YTD">YTD</button>
      </div>
    </div>

    <div id="chart"></div>

    <h3>Games</h3>
    <table id="games">
      <thead>
        <tr>
          <th>Date</th>
          <th>Opponent</th>
          <th>Elo</th>
          <th>Result</th>
          <th>Δ</th>
          <th>New</th>
        </tr>
      </thead>
      <tbody id="games-body"></tbody>
    </table>
  </section>
</main>

<script>
/* ---------- constants ---------- */
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');
if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL = 'data/players.json';
const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
const HIST_WCU    = id => `data/history/${encodeURIComponent(id)}_wcu.json`;
const GAMES_URL   = id => `data/games/${encodeURIComponent(id)}.json`;

const COLORS = { J:'#1f77b4', WCU:'#ff7f0e' };
const kFromRating = r => (r>=2200?10:r>=1800?20:30);

/* ---------- state ---------- */
let me = null, rawLive = [], rawWCU = [], seriesLive = null, seriesWCU = null, showWCU = false;
let dataMin = null, dataMax = null;
let initialRangeApplied = false;
let rememberedXRange = null;   // [x0,x1] strings yyyy-mm-dd
let ratingByDate = Object.create(null); // date -> J-rating from history JSON

/* ---------- helpers ---------- */
const iso = d => new Date(d).toISOString().slice(0,10);

function normalise(series){
  return series
    .filter(p => p && p.x && Number.isFinite(+p.y))
    .map(p => ({ x: p.x, y: +p.y }))
    .sort((a,b) => new Date(a.x) - new Date(b.x));
}

function dateKey(s) {
  return (s || "").slice(0, 10); // normalise to YYYY-MM-DD
}

/* Reorder same-day games so the "New" values make sense with Δ.
   Uses implied base: base_before = New - Δ.
   Earlier games have lower implied base, so we sort base ascending within the day. */
function reorderSameDayGamesByImpliedBase(games) {
  const byDate = new Map();

  for (const g of games) {
    const k = dateKey(g.date);
    if (!byDate.has(k)) byDate.set(k, []);
    byDate.get(k).push(g);
  }

  const keys = [...byDate.keys()].sort((a, b) => new Date(b) - new Date(a)); // newest day first

  const out = [];
  for (const k of keys) {
    const group = byDate.get(k);

    if (group.length > 1) {
      group.sort((a, b) => {
        const newA = Number.isFinite(+a._jNewRaw) ? +a._jNewRaw : (Number.isFinite(+a.jNew) ? +a.jNew : NaN);
        const newB = Number.isFinite(+b._jNewRaw) ? +b._jNewRaw : (Number.isFinite(+b.jNew) ? +b.jNew : NaN);

        const dA = parseDelta(a.delta);
        const dB = parseDelta(b.delta);

        if (Number.isFinite(newA) && Number.isFinite(dA) && Number.isFinite(newB) && Number.isFinite(dB)) {
          const baseA = newA - dA;
          const baseB = newB - dB;
          if (baseA !== baseB) return baseA - baseB; // earlier game first
        }

        // stable fallback: keep original JSON order
        return (a.__i ?? 0) - (b.__i ?? 0);
      });
    }

    out.push(...group);
  }

  return out;
}

function aggregateExpanded(series, mode){
  if (mode === 'daily') return normalise(series);
  const buckets = Object.create(null);
  for (const p of series) {
    const d = new Date(p.x);
    let key;
    if (mode === 'weekly') {
      const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = tmp.getUTCDay() || 7;
      tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
      key = `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
    } else if (mode === 'monthly') {
      key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    } else if (mode === 'quarterly') {
      const q = Math.floor(d.getMonth() / 3) + 1;
      key = `${d.getFullYear()}-Q${q}`;
    } else {
      key = `${d.getFullYear()}`;
    }
    (buckets[key] ||= []).push(+p.y);
  }
  const out = Object.keys(buckets).sort().map(k => {
    const ys = buckets[k].filter(Number.isFinite);
    const avg = ys.reduce((a,b)=>a+b,0)/ys.length;
    let x;
    if (k.includes('W')) {
      const [y,w] = k.split('-W'); const year = +y, week = +w;
      const simple = new Date(Date.UTC(year,0,1+(week-1)*7));
      const dow = simple.getUTCDay();
      if (dow <= 4) simple.setUTCDate(simple.getUTCDate() - dow + 1);
      else simple.setUTCDate(simple.getUTCDate() + 8 - dow);
      x = iso(simple);
    } else if (k.includes('Q')) {
      const [y,q] = k.split('-Q'); const year = +y, quarter = +q;
      x = iso(new Date(Date.UTC(year,(quarter-1)*3,1)));
    } else if (k.length === 7) {
      const [y,m] = k.split('-'); x = iso(new Date(Date.UTC(+y,(+m)-1,1)));
    } else {
      x = iso(new Date(Date.UTC(+k,0,1)));
    }
    return { x, y: avg };
  });
  return normalise(out);
}

function makeTrace(series, name, colour, mode){
  return {
    x:series.map(p=>p.x),
    y:series.map(p=>p.y),
    mode:(mode==='daily'?'lines':'lines+markers'),
    line:{width:2,shape:'linear',color:colour},
    marker:(mode==='daily'?{size:0}:{size:4}),
    name,
    hovertemplate:'%{y:.0f}<extra>'+name+'</extra>',
    connectgaps:true
  };
}

function extentFrom(...seriesList){
  const xs=[];
  for(const s of seriesList){
    if(!s) continue;
    for(const p of s){
      if(p?.x) xs.push(new Date(p.x));
    }
  }
  if(!xs.length) return{min:null,max:null};
  return{min:new Date(Math.min(...xs)),max:new Date(Math.max(...xs))};
}

function computeMetrics(series){
  const y=series?.map(p=>p.y)??[];
  const live=y.length?Math.round(y[y.length-1]):null;
  const peak=y.length?Math.round(Math.max(...y)):null;
  const kval=Number.isFinite(live)?kFromRating(live):null;
  return{live,peak,kval};
}

function refreshBadge(){
  const j=computeMetrics(seriesLive);
  document.getElementById('live-j').textContent=j.live??'–';
  document.getElementById('peak-j').textContent=j.peak??'–';
  document.getElementById('kval-j').textContent=(typeof me?.k==='number')?me.k:(j.kval??'–');

  const wcuRow=document.getElementById('stats-wcu');
  if(showWCU&&seriesWCU){
    const w=computeMetrics(seriesWCU);
    document.getElementById('live-wcu').textContent=w.live??'–';
    document.getElementById('peak-wcu').textContent=w.peak??'–';
    document.getElementById('kval-wcu').textContent=w.kval??'–';
    wcuRow.style.display='';
  } else {
    wcuRow.style.display='none';
  }
  document.getElementById('toggle').textContent=showWCU?'Hide WCU':'Show WCU';
}

/* recolour the tiny line in the rangeslider to match the background */
function recolourMiniToBackground() {
  const bg = getComputedStyle(document.body).backgroundColor;
  document.querySelectorAll('#chart g.rangeslider .plot path').forEach(el => {
    el.style.stroke = bg;
    el.style.fill = bg;
  });
}

function hideMini() {
  const chart = document.getElementById('chart');
  if (!chart) return;
  chart.querySelectorAll('g.rangeslider .plot, g.rangeslider .rangeplot')
    .forEach(el => { el.style.opacity = '0'; });
  chart.querySelectorAll(
    'g.rangeslider .gridlayer, ' +
    'g.rangeslider .zerolinelayer, ' +
    'g.rangeslider [class^="xaxislayer"], ' +
    'g.rangeslider [class^="yaxislayer"]'
  ).forEach(el => { el.style.display = 'none'; });
  recolourMiniToBackground();
}

/* rating from J history JSON on or before given date (fallback only) */
function ratingOnOrBefore(dateStr) {
  if (!dateStr) return null;
  const key = dateStr.slice(0, 10);

  if (ratingByDate && Object.prototype.hasOwnProperty.call(ratingByDate, key)) {
    return ratingByDate[key];
  }

  const target = new Date(key);
  let best = null;
  for (const p of rawLive) {
    if (!p || !p.x) continue;
    const d = new Date(p.x);
    if (d <= target && (!best || d > best.d)) {
      best = { d, r: p.y };
    }
  }
  return best ? best.r : null;
}

function clampToData(range){
  if(!range||!dataMin||!dataMax) return range;
  const [x0,x1]=range.map(x=>new Date(x));
  const lo=new Date(Math.max(+x0,+dataMin));
  const hi=new Date(Math.min(+x1,+dataMax));
  return [iso(lo),iso(hi)];
}

function adjustYToVisible(x0, x1){
  const lo = new Date(x0), hi = new Date(x1);

  const values = [];

  if (seriesLive?.length) {
    for (const p of seriesLive) {
      const d = new Date(p.x);
      if (d >= lo && d <= hi && Number.isFinite(p.y)) {
        values.push(p.y);
      }
    }
  }

  if (showWCU && seriesWCU?.length) {
    for (const p of seriesWCU) {
      const d = new Date(p.x);
      if (d >= lo && d <= hi && Number.isFinite(p.y)) {
        values.push(p.y);
      }
    }
  }

  if (!values.length) return;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || 10;

  Plotly.relayout('chart', {
    'yaxis.range': [min - pad, max + pad]
  });
}

/* ---------- chart ---------- */
function draw(){
  const mode=document.getElementById('agg').value;

  const gd=document.getElementById('chart');
  const liveLayout = gd && gd._fullLayout ? gd._fullLayout.xaxis : null;
  if (liveLayout && liveLayout.range) {
    rememberedXRange = [liveLayout.range[0], liveLayout.range[1]];
  }

  seriesLive = aggregateExpanded(rawLive,mode);
  seriesWCU  = rawWCU.length ? aggregateExpanded(rawWCU,mode) : null;

  const traces=[makeTrace(seriesLive,'J-Ratings',COLORS.J,mode)];
  if(showWCU&&seriesWCU) traces.push(makeTrace(seriesWCU,'WCU',COLORS.WCU,mode));

  const ext=extentFrom(seriesLive,seriesWCU);
  dataMin=ext.min; dataMax=ext.max;

  const bg=getComputedStyle(document.body).backgroundColor;
  const baseLayout={
    margin:{l:50,r:20,t:10,b:40},
    xaxis: {
      type: 'date',
      fixedrange: true,
      rangeslider: { visible: true, thickness: 0.04, borderwidth: 0, bgcolor: '#0f1623' }
    },
    yaxis:{title:'Rating',fixedrange:true},
    paper_bgcolor:bg,plot_bgcolor:bg,
    font:{color:getComputedStyle(document.body).color},
    legend:{orientation:'h',x:0,y:1.1},
    shapes:[]
  };

  if (!initialRangeApplied && dataMin && dataMax) {
    const end=new Date(dataMax);
    const start=new Date(end.getTime()-365*24*60*60*1000);
    rememberedXRange = [iso(new Date(Math.max(start,dataMin))), iso(end)];
    initialRangeApplied = true;
  }

  Plotly.react('chart', traces, baseLayout, {
    staticPlot:false,scrollZoom:false,displayModeBar:false,responsive:true
  }).then(() => {
    if (rememberedXRange) {
      const [x0,x1]=clampToData(rememberedXRange);
      Plotly.relayout('chart', {'xaxis.range':[x0,x1]}).then(()=>adjustYToVisible(x0,x1));
    }

    const gd2=document.getElementById('chart');
    if (!gd2._jrHandlersAttached) {
      gd2.on('plotly_relayout', ev => {
        const x0=ev['xaxis.range[0]']??(ev['xaxis.range'] && ev['xaxis.range'][0]);
        const x1=ev['xaxis.range[1]']??(ev['xaxis.range'] && ev['xaxis.range'][1]);
        if (x0 && x1) {
          rememberedXRange=[x0,x1];
          adjustYToVisible(x0,x1);
        }
        hideMini();
      });

      window.addEventListener('resize', hideMini);

      new MutationObserver(() => {
        hideMini();
      }).observe(document.getElementById('chart'), {
        childList: true,
        subtree: true
      });

      gd2._jrHandlersAttached = true;
    }

    hideMini();
  });
}

/* ---------- table helpers ---------- */
function getId(g,base){return g[base+'Id']??g[base+'_id']??g[base+'ID']??null;}
function resultClass(r){if(r==='Win')return'result-win';if(r==='Draw')return'result-draw';if(r==='Loss')return'result-loss';return'';}
function deltaClass(d){if(!d)return'';if(d.startsWith('+'))return'delta-pos';if(d.startsWith('-'))return'delta-neg';return'delta-zero';}

function parseDelta(deltaVal){
  if (deltaVal == null) return null;
  if (typeof deltaVal === 'number' && Number.isFinite(deltaVal)) return deltaVal;
  if (typeof deltaVal === 'string') {
    const x = parseFloat(deltaVal);
    return Number.isFinite(x) ? x : null;
  }
  return null;
}

/* Returns a raw (non-rounded) "new" rating for ordering purposes.
   You still display rounded integers in the table. */
function computeGameNewRaw(g){
  if (g.new != null && Number.isFinite(+g.new)) return +g.new;
  if (g.playerNew != null && Number.isFinite(+g.playerNew)) return +g.playerNew;

  const pe = (g.playerElo != null && Number.isFinite(+g.playerElo)) ? +g.playerElo : null;
  const de = parseDelta(g.delta);
  if (pe != null && de != null) return pe + de;

  const r = ratingOnOrBefore(g.date);
  return Number.isFinite(r) ? +r : null;
}

function renderGamesTable(games){
  const tbody = document.getElementById('games-body');
  tbody.innerHTML = '';

  for (const g of games) {

    // Filter rule: skip low Elo opponents
    if (
      g.opponentElo != null &&
      Number.isFinite(+g.opponentElo) &&
      +g.opponentElo < 500
    ) {
      continue;
    }

    const tr = document.createElement('tr');

    const cols = ["date", "opponent", "opponentElo", "result", "delta", "jNew"];

    for (const col of cols) {
      const td = document.createElement("td");

      if (col === "opponent") {
        const name = g[col] ?? "";
        const id = getId(g, col);
        if (id) {
          const a = document.createElement("a");
          a.href = `player.html?id=${encodeURIComponent(id)}`;
          a.textContent = name;
          td.appendChild(a);
        } else {
          td.textContent = name;
        }

      } else if (col === "jNew") {
        td.textContent = (g.jNew != null) ? g.jNew : "";

      } else {
        td.textContent =
          (col === "playerElo" || col === "opponentElo")
            ? (g[col] != null ? Math.round(g[col]) : "")
            : (g[col] ?? "");
      }

      if (col === "result") td.className = resultClass(g[col]);
      if (col === "delta")  td.className = deltaClass(g[col]);

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }
}

/* ---------- load ---------- */
async function load(){
  try{
    const[playersRes,liveRes,wcuRes,gamesRes]=await Promise.all([
      fetch(PLAYERS_URL,{cache:'no-cache'}),
      fetch(HIST_URL(idRaw),{cache:'no-cache'}),
      fetch(HIST_WCU(idRaw),{cache:'no-cache'}).catch(()=>null),
      fetch(GAMES_URL(idRaw),{cache:'no-cache'}).catch(()=>null)
    ]);

    if(!playersRes.ok)throw new Error('players.json not found');
    if(!liveRes.ok)throw new Error('live history not found');

    const players=await playersRes.json();
    me=players.find(p=>p.id===idRaw);
    if(!me)throw new Error('player id not in players.json');
    document.getElementById('pname').textContent=me.name;

    const liveData = await liveRes.json();

    rawLive = liveData
      .map(d => ({ x: d.date, y: +d.rating }))
      .filter(p => Number.isFinite(p.y));

    ratingByDate = Object.create(null);
    for (const d of liveData) {
      const key = (d.date || '').slice(0, 10);
      const val = +d.rating;
      if (Number.isFinite(val)) ratingByDate[key] = val;
    }

    if(wcuRes&&wcuRes.ok){
      rawWCU=(await wcuRes.json())
        .map(d=>({x:d.date,y:+d.rating}))
        .filter(p=>Number.isFinite(p.y));
      document.getElementById('toggle').disabled=false;
    }else{
      rawWCU=[];
      document.getElementById('toggle').disabled=true;
      document.getElementById('toggle').textContent='WCU N/A';
    }

    draw();
    refreshBadge();

    document.getElementById('agg').addEventListener('change',()=>{
      draw();
      refreshBadge();
    });

    document.querySelectorAll('.range-buttons .seg').forEach(btn=>{
      btn.addEventListener('click',()=>setPreset(btn.dataset.range));
    });

    if (gamesRes && gamesRes.ok) {
      let games = await gamesRes.json();

      // stable fallback order (used only if the implied-base sort cannot decide)
      games.forEach((g, idx) => { g.__i = idx; });

      // compute raw + display "New" BEFORE we reorder (this is the critical fix)
      for (const g of games) {
        g._jNewRaw = computeGameNewRaw(g);
        g.jNew = Number.isFinite(g._jNewRaw) ? Math.round(g._jNewRaw) : null;
      }

      // reorder within each day so the New column is coherent with Δ
      games = reorderSameDayGamesByImpliedBase(games);

      renderGamesTable(games);
    }
  }catch(e){
    console.error(e);
    document.getElementById('chart').textContent='No Games';
  }
}

/* ---------- range presets ---------- */
function setPreset(key){
  if(!dataMin||!dataMax) return;
  const end=new Date(dataMax);
  let start=null;

  if(key==='ALL'){
    start=new Date(dataMin);
  } else if(key==='2015'){
    start=new Date('2015-01-01');
  } else if(key==='2022'){
    start=new Date('2022-01-01');
  } else if(key==='LY'){
    start=new Date(end); start.setFullYear(start.getFullYear()-1);
  } else if(key==='YTD'){
    start=new Date(end.getFullYear()+'-01-01');
  } else {
    start=new Date(dataMin);
  }

  const range=[iso(new Date(Math.max(+start,+dataMin))), iso(end)];
  rememberedXRange=range;
  Plotly.relayout('chart', {'xaxis.range':range}).then(()=>adjustYToVisible(range[0],range[1]));
}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='toggle'&&!e.target.disabled){
    showWCU=!showWCU;
    draw();
    refreshBadge();
  }
});

load();
</script>
