<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    .player-head{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0}
    .badge{border:1px solid var(--border);background:#0f1623;border-radius:8px;padding:6px 10px}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1><a href="index.html" style="color:#8b949e;text-decoration:none"></a></h1>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <h2 id="pname">Player</h2>
      <div class="badge"><span class="muted">Live K:</span> <strong id="kval">–</strong></div>
    </div>
    <div id="chart" style="height:420px"></div>
  </section>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');                      
  if (!idRaw) { document.getElementById('chart').innerHTML = 'Missing player id.'; throw new Error('no id'); }

  const PLAYERS_URL = 'data/players.json';
  const HIST_URL    = `data/history/${encodeURIComponent(idRaw)}.json`;
console.log('HIST_URL =', HIST_URL);
  async function load() {
    try {
      const [playersRes, histRes] = await Promise.all([
        fetch(PLAYERS_URL, {cache:'no-cache'}),
        fetch(HIST_URL, {cache:'no-cache'})
      ]);
      if (!playersRes.ok) throw new Error('players.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const players = await playersRes.json();
      const hist = await histRes.json();

      const me = players.find(p => p.id === idRaw);
      if (!me) throw new Error('player id not in players.json');

      document.getElementById('pname').textContent = me.name;
      document.getElementById('kval').textContent = (me.k ?? '–');

      const x = hist.map(d => d.date);
      const y = hist.map(d => d.rating);

      const bg = getComputedStyle(document.body).backgroundColor;
      Plotly.newPlot('chart', [{
        x, y, mode: 'lines',
        hovertemplate: '%{x}<br>%{y}<extra></extra>'
      }], {
        margin:{l:50,r:20,t:10,b:40},
        xaxis:{type:'date', title:''},
        yaxis:{title:'Rating'},
        paper_bgcolor:bg, plot_bgcolor:bg, font:{color:getComputedStyle(document.body).color}
      }, {displayModeBar:false, responsive:true});
    } catch (e) {
      document.getElementById('chart').innerHTML = 'No Games';
      console.error(e);
    }
  }
  load();
</script>
</body>
</html>
