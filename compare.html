<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compare — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
    .row{display:flex;gap:8px;align-items:center;width:100%;margin-bottom:8px}
    .row input[type="text"]{flex:1;min-width:220px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0f1623;color:var(--text)}
    .btn{background:#0f1623;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer}
    .btn:hover{background:rgba(255,255,255,0.05)}
    .muted-note{color:var(--muted);font-size:.9rem}

    /* Autocomplete */
    .suggest{position:relative;flex:1}
    .suggest-list{
      position:absolute;left:0;right:0;top:100%;
      max-height:220px;overflow:auto;margin-top:4px;
      border:1px solid var(--border);background:#0f1623;border-radius:6px;
      display:none;z-index:20
    }
    .suggest-item{padding:8px 10px;cursor:pointer}
    .suggest-item:hover{background:rgba(255,255,255,.05)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1 class="site-title"><a href="index.html">J-Ratings</a></h1>
      <span class="muted subtitle">Compare players</span>
    </div>
    <nav class="zones" aria-label="Zones">
      <a href="zones/dyfed.html">Dyfed</a>
      <a href="zones/east-glam.html">East Glamorgan</a>
      <a href="zones/gwent.html">Gwent</a>
      <a href="zones/north-wales.html">North Wales</a>
      <a href="zones/west-wales.html">West Wales</a>
      <a href="compare.html" class="active-zone">Compare</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 style="margin:0;padding:16px 18px;border-bottom:1px solid var(--border)">Compare</h2>

    <div class="controls" id="controls">
      <div id="rows" style="flex:1 1 600px"></div>

      <!-- Big primary action under the rows -->
      <button id="add" class="btn" type="button" style="width:100%;margin-top:8px">Add player</button>

      <!-- Secondary row: Create + Clear (small) -->
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>

      <div class="muted-note">Up to 6 players. Start typing a name, pick a suggestion, then Create.</div>
    </div>

    <div style="padding:16px">
      <div id="chart" style="height:520px"></div>
    </div>
  </section>
</main>

<script>
const PLAYERS_URL = './data/players.json';
const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
const MAX_PLAYERS = 6;

const state = {
  players: [],   // [{id,name,zone,club,rating}]
  inputs: []     // [{el,input}]
};

/* ---------- Autocomplete ---------- */
function attachAutocomplete(input){
  const wrap = document.createElement('div');
  wrap.className = 'suggest';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  const list = document.createElement('div');
  list.className = 'suggest-list';
  wrap.appendChild(list);

  function render(items){
    if (!items.length){ list.style.display='none'; list.innerHTML=''; return; }
    list.innerHTML = items.map(n => `<div class="suggest-item" data-name="${n}">${n}</div>`).join('');
    list.style.display='block';
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q){ render([]); return; }
    const names = state.players.map(p => p.name);
    const starts = names.filter(n => n.toLowerCase().startsWith(q));
    const contains = names.filter(n => !n.toLowerCase().startsWith(q) && n.toLowerCase().includes(q));
    render(starts.concat(contains).slice(0, 12));
  });

  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.suggest-item');
    if (!item) return;
    input.value = item.dataset.name;
    list.style.display='none';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      const first = list.querySelector('.suggest-item');
      if (first){ input.value = first.dataset.name; list.style.display='none'; }
    }
    if (e.key === 'Escape') list.style.display='none';
  });

  input.addEventListener('blur', () => setTimeout(() => { list.style.display='none'; }, 120));
}

/* ---------- Rows ---------- */
function makeRow(){
  if (state.inputs.length >= MAX_PLAYERS) return;
  const rows = document.getElementById('rows');

  const wrap = document.createElement('div');
  wrap.className = 'row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search player…';

  attachAutocomplete(input);

  const remove = document.createElement('button');
  remove.className = 'btn';
  remove.type = 'button';
  remove.textContent = 'Remove';
  remove.addEventListener('click', () => {
    rows.removeChild(wrap);
    state.inputs = state.inputs.filter(r => r.el !== wrap);
    document.getElementById('add').disabled = state.inputs.length >= MAX_PLAYERS;
  });

  wrap.appendChild(input);
  wrap.appendChild(remove);
  rows.appendChild(wrap);

  state.inputs.push({ el: wrap, input });
  document.getElementById('add').disabled = state.inputs.length >= MAX_PLAYERS;
}

function clearAll(){
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  state.inputs = [];
  document.getElementById('add').disabled = false;
  document.getElementById('chart').innerHTML = '';
}

/* ---------- Chart ---------- */
async function createChart(){
  const names = state.inputs.map(r => r.input.value.trim()).filter(Boolean);
  if (!names.length){ alert('Add at least one player.'); return; }

  // Resolve names → players (case-insensitive exact match)
  const picks = [];
  const lower = s => s.toLowerCase();
  for (const name of names){
    const p = state.players.find(x => lower(x.name) === lower(name));
    if (p) picks.push(p);
  }
  if (!picks.length){ alert('No valid players selected.'); return; }

  const chart = document.getElementById('chart');
  chart.innerHTML = 'Loading…';

  const series = [];
  await Promise.all(picks.map(async p => {
    try{
      const res = await fetch(HIST_URL(p.id), { cache: 'no-cache' });
      if (!res.ok) return;
      const hist = await res.json();
      if (!Array.isArray(hist) || !hist.length) return;
      series.push({
        name: p.name,
        x: hist.map(d => d.date),
        y: hist.map(d => d.rating),
        mode: 'lines+markers',
        hovertemplate: '%{x}<br>%{y}<extra>' + p.name + '</extra>'
      });
    }catch(_){/* ignore */}
  }));

  if (!series.length){ chart.innerHTML = 'No history for the selected players.'; return; }

  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const cs = getComputedStyle(document.body);

  Plotly.newPlot('chart', series, {
    margin:{l:50,r:20,t:10,b:40},
    xaxis:{type:'date', title:''},
    yaxis:{title:'Rating'},
    legend:{orientation:'h'},
    paper_bgcolor: cs.backgroundColor,
    plot_bgcolor: cs.backgroundColor,
    font:{color: cs.color}
  }, {
    displayModeBar:false,
    responsive:true,
    staticPlot: isTouch
  });
}

/* ---------- Boot ---------- */
async function load(){
  const res = await fetch(PLAYERS_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('players.json not found');
  state.players = await res.json();
  makeRow(); // start with one row
}

// Ensure handlers are attached even if load() fails
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('add').addEventListener('click', makeRow);
  document.getElementById('clear').addEventListener('click', clearAll);
  document.getElementById('create').addEventListener('click', createChart);

  load().catch(e => {
    console.error(e);
    document.querySelector('.muted-note').textContent =
      'Could not load player list. Check data path or run via a local server.';
    // Still give you a row so Add/Create work even if players.json failed
    makeRow();
  });
});
</script>
</body>
</html>
