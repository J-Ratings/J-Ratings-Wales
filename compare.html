<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compare — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    .controls{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border)}
    .row{display:flex;gap:8px;align-items:center;width:100%}
    .row input[type="text"]{flex:1;min-width:220px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0f1623;color:var(--text)}
    .btn{background:#0f1623;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer}
    .btn:hover{background:rgba(255,255,255,0.05)}
    .muted-note{color:var(--muted);font-size:.9rem}
    .suggest{position:relative;flex:1}
    .suggest-list{
      position:absolute;left:0;right:0;top:100%;
      max-height:300px;overflow:auto;margin-top:4px;
      border:1px solid var(--border);background:#0f1623;border-radius:6px;
      display:none;z-index:20
    }
    .suggest-item{padding:8px 10px;cursor:pointer}
    .suggest-item:hover{background:rgba(255,255,255,.05)}

    /* Range buttons */
    .range-buttons{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.5rem}
    .range-buttons .seg{
      background:#0f1623;border:1px solid var(--border);color:var(--text);
      padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem;
    }
    .range-buttons .seg:hover{background:rgba(255,255,255,.05)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1 class="site-title"><a href="index.html">J-Ratings</a></h1>
      <span class="muted subtitle">Compare players</span>
    </div>
    <nav class="zones" aria-label="Zones">
      <a href="zones/dyfed.html">Dyfed</a>
      <a href="zones/east-glam.html">East Glamorgan</a>
      <a href="zones/gwent.html">Gwent</a>
      <a href="zones/north-wales.html">North Wales</a>
      <a href="zones/west-wales.html">West Wales</a>
      <a href="compare.html" class="active-zone">Compare</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 style="margin:0;padding:16px 18px;border-bottom:1px solid var(--border)">Compare</h2>

    <div class="controls">
      <div id="rows"></div>

      <button id="add" class="btn" type="button">Add player</button>
      <div style="display:flex;gap:8px">
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label for="agg">View:</label>
        <select id="agg">
          <option value="daily" selected>Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>

        <div class="range-buttons">
          <button class="seg" data-range="ALL">ALL</button>
          <button class="seg" data-range="2015">2015–Present</button>
          <button class="seg" data-range="2022">2022–Present</button>
          <button class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

      <div class="muted-note">Start typing a name, pick a suggestion, then Create.</div>
    </div>

    <div style="padding:16px">
      <div id="chart" style="height:450px"></div>
    </div>
  </section>
</main>

<script>
const PLAYERS_URL = './data/players.json';
const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
const MAX_PLAYERS = 20;

const state = { players: [], inputs: [], dataMin:null, dataMax:null, initialRangeSet:false };

/* --------- helpers --------- */
function iso(d){ return new Date(d).toISOString().slice(0,10); }

function normalise(series){
  return series.filter(p=>p && p.x && Number.isFinite(p.y))
    .map(p=>({x:p.x,y:+p.y}))
    .sort((a,b)=>new Date(a.x)-new Date(b.x));
}

function aggregateExpanded(series, mode){
  if(mode==='daily') return normalise(series);
  const buckets={};
  for(const p of series){
    const d=new Date(p.x);
    let key;
    if(mode==='weekly'){
      const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
      const dayNum=tmp.getUTCDay()||7;
      tmp.setUTCDate(tmp.getUTCDate()+4-dayNum);
      const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
      const weekNo=Math.ceil((((tmp-yearStart)/86400000)+1)/7);
      key=`${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
    }else if(mode==='monthly'){
      key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }else if(mode==='quarterly'){
      const q=Math.floor(d.getMonth()/3)+1;
      key=`${d.getFullYear()}-Q${q}`;
    }else{
      key=`${d.getFullYear()}`;
    }
    (buckets[key] ||= []).push(p.y);
  }
  const out=Object.keys(buckets).sort().map(k=>{
    const ys=buckets[k].filter(Number.isFinite);
    const avg=ys.reduce((a,b)=>a+b,0)/ys.length;
    let x;
    if(k.includes('W')){
      const [y,w]=k.split('-W'); const year=+y, week=+w;
      const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
      const dow=simple.getUTCDay();
      if(dow<=4) simple.setUTCDate(simple.getUTCDate()-dow+1);
      else simple.setUTCDate(simple.getUTCDate()+8-dow);
      x=iso(simple);
    }else if(k.includes('Q')){
      const [y,q]=k.split('-Q'); const year=+y, quarter=+q;
      const month=(quarter-1)*3;
      x=iso(new Date(Date.UTC(year,month,1)));
    }else if(k.length===7){ x=`${k}-01`; }
    else{ x=`${k}-01-01`; }
    return {x,y:avg};
  });
  return normalise(out);
}

function extentFrom(seriesList){
  const xs=[];
  for(const s of seriesList){ if(!s) continue; for(const p of s){ if(p?.x) xs.push(new Date(p.x)); } }
  if(!xs.length) return {min:null,max:null};
  return {min:new Date(Math.min(...xs)), max:new Date(Math.max(...xs))};
}

function setXRange(start,end){
  if(!state.dataMin||!state.dataMax) return;
  const s=new Date(Math.max(new Date(start),state.dataMin));
  const e=new Date(Math.min(new Date(end),state.dataMax));
  Plotly.relayout('chart',{'xaxis.range':[iso(s),iso(e)]});
}

function setPreset(which){
  const now=new Date();
  if(which==='ALL'){ setXRange(state.dataMin,state.dataMax); return; }
  if(which==='YTD'){
    const yStart=new Date(Date.UTC(now.getUTCFullYear(),0,1));
    setXRange(yStart,state.dataMax); return;
  }
  const y=parseInt(which,10);
  const start=new Date(Date.UTC(y,0,1));
  setXRange(start,state.dataMax);
}

/* --------- chart --------- */
function majorGridShapes(ymin,ymax){
  const shapes=[]; for(let v=ymin;v<=ymax;v+=100){
    shapes.push({type:'line',xref:'paper',x0:0,x1:1,y0:v,y1:v,line:{width:1,color:'rgba(128,128,128,0.35)'},layer:'below'});
  } return shapes;
}

function createChart(){
  const names=state.inputs.map(r=>r.input.value.trim()).filter(Boolean);
  if(!names.length) return alert('Please add at least one player');
  const mode=document.getElementById('agg').value;

  Promise.all(names.map(name=>{
    const player=state.players.find(p=>p.name===name); if(!player) return null;
    return fetch(HIST_URL(player.id)).then(r=>r.json()).then(hist=>{
      const raw=hist.map(h=>({x:h.date,y:+h.rating}));
      const series=aggregateExpanded(raw,mode);
      return {
        name,
        x:series.map(p=>p.x),
        y:series.map(p=>p.y),
        mode:(mode==='daily'?'lines':'lines+markers'),
        marker:(mode==='daily'?{size:0}:{size:4}),
        line:{width:2},
        hovertemplate:'%{x} → %{y:.0f}<extra>'+name+'</extra>'
      };
    });
  })).then(series=>{
    series=series.filter(Boolean); if(!series.length) return;

    const allY=series.flatMap(s=>s.y).filter(Number.isFinite);
    const ymin=Math.floor(Math.min(...allY)/100)*100;
    const ymax=Math.ceil(Math.max(...allY)/100)*100;

    const ext=extentFrom(series.map(s=>s.x.map((x,i)=>({x:s.x[i],y:s.y[i]}))));
    state.dataMin=ext.min; state.dataMax=ext.max;

    const layout={
      margin:{t:30,r:20,l:50,b:50},
      paper_bgcolor:'#0f1623',plot_bgcolor:'#0f1623',
      font:{color:'#ccc'},
      xaxis:{
        type:'date',
        gridcolor:'#222',zeroline:false,
        rangeslider:{visible:true,thickness:0.12},
      },
      yaxis:{title:"Rating",autorange:true,gridcolor:'#222',zeroline:false,tickformat:'.0f'},
      legend:{x:1,y:0,bgcolor:'rgba(0,0,0,0)'},
      shapes:majorGridShapes(ymin,ymax)
    };

    if(!state.initialRangeSet && state.dataMin && state.dataMax){
      const defStart=new Date(Date.UTC(2024,0,1));
      const start=(state.dataMin>defStart)?state.dataMin:defStart;
      layout.xaxis.range=[iso(start),iso(state.dataMax)];
      state.initialRangeSet=true;
    }

    Plotly.newPlot('chart',series,layout,{responsive:true,displayModeBar:false});
  });
}

/* --------- UI helpers --------- */
function attachAutocomplete(input){
  const wrap=document.createElement('div'); wrap.className='suggest';
  input.parentNode.insertBefore(wrap,input); wrap.appendChild(input);
  const list=document.createElement('div'); list.className='suggest-list'; wrap.appendChild(list);
  function render(items){
    if(!items.length){ list.style.display='none'; list.innerHTML=''; return; }
    list.innerHTML=items.map(n=>`<div class="suggest-item" data-name="${n}">${n}</div>`).join('');
    list.style.display='block';
  }
  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase(); if(!q){ render([]); return; }
    const names=state.players.map(p=>p.name);
    const starts=names.filter(n=>n.toLowerCase().startsWith(q));
    const contains=names.filter(n=>!n.toLowerCase().startsWith(q) && n.toLowerCase().includes(q));
    render(starts.concat(contains).slice(0,12));
  });
  list.addEventListener('mousedown',e=>{
    const item=e.target.closest('.suggest-item'); if(!item)return;
    input.value=item.dataset.name; list.style.display='none';
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ const first=list.querySelector('.suggest-item'); if(first){ input.value=first.dataset.name; list.style.display='none'; } }
    if(e.key==='Escape') list.style.display='none';
  });
  input.addEventListener('blur',()=>setTimeout(()=>{ list.style.display='none'; },120));
}

function makeRow(){
  if(state.inputs.length>=MAX_PLAYERS) return;
  const rows=document.getElementById('rows');
  const wrap=document.createElement('div'); wrap.className='row';
  const input=document.createElement('input'); input.type='text'; input.placeholder='Search player…'; wrap.appendChild(input);
  attachAutocomplete(input);
  const remove=document.createElement('button'); remove.className='btn'; remove.type='button'; remove.textContent='Remove';
  remove.addEventListener('click',()=>{ rows.removeChild(wrap); state.inputs=state.inputs.filter(r=>r.el!==wrap); document.getElementById('add').disabled=state.inputs.length>=MAX_PLAYERS; });
  wrap.appendChild(remove); rows.appendChild(wrap);
  state.inputs.push({el:wrap,input}); document.getElementById('add').disabled=state.inputs.length>=MAX_PLAYERS;
}

function clearAll(){ document.getElementById('rows').innerHTML=''; state.inputs=[]; state.initialRangeSet=false; document.getElementById('add').disabled=false; }

async function load(){ const res=await fetch(PLAYERS_URL); if(!res.ok) throw new Error(`HTTP ${res.status}`); state.players=await res.json(); }

/* --------- init --------- */
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('add').addEventListener('click',makeRow);
  document.getElementById('clear').addEventListener('click',clearAll);
  document.getElementById('create').addEventListener('click',createChart);
  document.getElementById('agg').addEventListener('change',createChart);
  document.querySelectorAll('.range-buttons .seg').forEach(btn=>{
    btn.addEventListener('click',()=>setPreset(btn.dataset.range));
  });
  load().then(makeRow).catch(e=>{ console.error(e); document.querySelector('.muted-note').textContent='Could not load player list.'; makeRow(); });
});
</script>
</body>
</html>
