<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compare — J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    .compare-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin:12px 0;
      padding-right:12px;
    }

    .controls{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:1rem;
    }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
      width:100%;
    }

    .row input[type="text"]{
      flex:1;
      min-width:220px;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--border);
      background:#0f1623;
      color:var(--text);
    }

    .btn,
    .btn-mini{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      border-radius:6px;
      cursor:pointer;
    }

    .btn{
      padding:8px 12px;
    }

    .btn-mini{
      padding:4px 8px;
      font-size:.9rem;
    }

    .btn:hover,
    .btn-mini:hover:not([disabled]){
      background:rgba(255,255,255,.05);
    }

    .btn[disabled],
    .btn-mini[disabled]{
      opacity:.5;
      cursor:default;
    }

    .muted-note{
      color:var(--muted);
      font-size:.9rem;
    }

    .suggest{
      position:relative;
      flex:1;
    }

    .suggest-list{
      position:absolute;
      left:0;
      right:0;
      top:100%;
      max-height:300px;
      overflow:auto;
      margin-top:4px;
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:6px;
      display:none;
      z-index:20;
    }

    .suggest-item{
      padding:8px 10px;
      cursor:pointer;
    }

    .suggest-item:hover{
      background:rgba(255,255,255,.05);
    }

    #chart{
      height:420px;
      touch-action:pan-y;
    }

    .range-buttons{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      align-items:center;
      margin:.5rem 0 .25rem 0;
    }

    .range-buttons .seg{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:.9rem;
    }

    .range-buttons .seg:hover{
      background:rgba(255,255,255,.05);
    }

    .range-buttons .seg.active{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.9);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1 class="site-title"><a href="index.html">J-Ratings</a></h1>
      <span class="muted subtitle">Compare players</span>
    </div>

    <nav class="zones" aria-label="Zones">
      <a href="zones/dyfed.html">Dyfed</a>
      <a href="zones/east-glam.html">East Glamorgan</a>
      <a href="zones/gwent.html">Gwent</a>
      <a href="zones/north-wales.html">North Wales</a>
      <a href="zones/west-wales.html">West Wales</a>
      <a href="compare.html" class="active-zone">Compare</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="compare-head">
      <h2 style="margin:0">Compare</h2>
    </div>

    <div class="controls">
      <div id="rows"></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="add" class="btn" type="button">Add player</button>
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>

      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <div>
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="range-buttons">
          <button class="seg" data-range="ALL">ALL</button>
          <button class="seg" data-range="2015">2015–Present</button>
          <button class="seg" data-range="2022">2022–Present</button>
          <button class="seg" data-range="LY">Last Year</button>
          <button class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

      <div class="muted-note">
        Start typing a name, pick a suggestion, then Create.
      </div>
    </div>

    <div id="chart"></div>
  </section>
</main>

<script>
/* ---------- constants ---------- */
const PLAYERS_URL = './data/players.json';
const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
const MAX_PLAYERS = 20;

/* ---------- state ---------- */
const state = {
  players: [],
  inputs: [],
  rawById: Object.create(null),
  series: [],
  dataMin: null,
  dataMax: null,
  chartCreated: false
};

let rememberedXRange = null;
let activeRangeKey = '2022';
let initialRangeApplied = false;

/* ---------- helpers ---------- */
const iso = d => new Date(d).toISOString().slice(0, 10);

function normalise(series){
  return series
    .filter(p => p && p.x && Number.isFinite(+p.y))
    .map(p => ({ x: p.x, y: +p.y }))
    .sort((a, b) => new Date(a.x) - new Date(b.x));
}

function labelStepForRange(y0, y1) {
  const span = Math.abs(y1 - y0);
  if (span < 100) return 25;
  if (span < 300) return 50;
  return 100;
}

function setTickLabelsEvery(yMin, yMax, step) {
  const lo = Math.floor(yMin / step) * step;
  const hi = Math.ceil(yMax / step) * step;

  const vals = [];
  const text = [];

  for (let y = lo; y <= hi; y += step) {
    vals.push(y);
    text.push(String(y));
  }

  Plotly.relayout('chart', {
    'yaxis.tickmode': 'array',
    'yaxis.tickvals': vals,
    'yaxis.ticktext': text
  });
}

function aggregateExpanded(series, mode){
  if (mode === 'daily') return normalise(series);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);
    let key;

    if (mode === 'weekly') {
      const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = tmp.getUTCDay() || 7;

      tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);

      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);

      key = `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    } else if (mode === 'monthly') {
      key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    } else if (mode === 'quarterly') {
      const q = Math.floor(d.getMonth() / 3) + 1;
      key = `${d.getFullYear()}-Q${q}`;
    } else {
      key = `${d.getFullYear()}`;
    }

    (buckets[key] ||= []).push(+p.y);
  }

  const out = Object.keys(buckets).sort().map(k => {
    const ys = buckets[k].filter(Number.isFinite);
    const avg = ys.reduce((a, b) => a + b, 0) / ys.length;

    let x;

    if (k.includes('W')) {
      const [y, w] = k.split('-W');
      const year = +y;
      const week = +w;
      const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
      const dow = simple.getUTCDay();

      if (dow <= 4) simple.setUTCDate(simple.getUTCDate() - dow + 1);
      else simple.setUTCDate(simple.getUTCDate() + 8 - dow);

      x = iso(simple);
    } else if (k.includes('Q')) {
      const [y, q] = k.split('-Q');
      x = iso(new Date(Date.UTC(+y, (+q - 1) * 3, 1)));
    } else if (k.length === 7) {
      const [y, m] = k.split('-');
      x = iso(new Date(Date.UTC(+y, (+m) - 1, 1)));
    } else {
      x = iso(new Date(Date.UTC(+k, 0, 1)));
    }

    return { x, y: avg };
  });

  return normalise(out);
}

function makeTrace(series, name){
  return {
    x: series.map(p => p.x),
    y: series.map(p => p.y),
    mode: 'lines',
    line: {
      width: 3,
      shape: 'linear'
    },
    name,
    hovertemplate: '%{y:.0f}<extra>' + name + '</extra>',
    connectgaps: true
  };
}

function extentFrom(seriesList){
  const xs = [];

  for (const s of seriesList) {
    if (!s) continue;

    for (const p of s) {
      if (p?.x) xs.push(new Date(p.x));
    }
  }

  if (!xs.length) return { min: null, max: null };

  return {
    min: new Date(Math.min(...xs)),
    max: new Date(Math.max(...xs))
  };
}

function clampRangeStartOnly(range){
  if (!range || !state.dataMin) return range;

  const [x0, x1] = range.map(x => new Date(x));
  const lo = new Date(Math.max(+x0, +state.dataMin));

  return [iso(lo), iso(x1)];
}

function makePaddedEnd(start, endData){
  const oneDay = 86400000;
  const spanMs = Math.max(oneDay, +endData - +start);

  const padMs = Math.max(
    3 * oneDay,
    Math.min(14 * oneDay, spanMs * 0.02)
  );

  return new Date(+endData + padMs);
}

function updateActiveRangeButton(){
  document.querySelectorAll('.range-buttons .seg').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === activeRangeKey);
  });
}

/* ---------- custom Y gridlines ---------- */
function makeYGridShapes(yMin, yMax, step) {
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || !step) return [];

  const lo = Math.floor((yMin - 1) / step) * step;
  const hi = Math.ceil((yMax + 1) / step) * step;
  const shapes = [];

  for (let y = lo; y <= hi; y += step) {
    let width, color;

    if (step === 100) {
      width = 2.2;
      color = 'rgba(255,255,255,0.28)';
    } else if (step === 50) {
      width = 1.4;
      color = 'rgba(255,255,255,0.16)';
    } else {
      width = 1.0;
      color = 'rgba(255,255,255,0.08)';
    }

    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      yref: 'y',
      y0: y,
      y1: y,
      line: { width, color }
    });
  }

  return shapes;
}

function adjustYToVisible(x0, x1) {
  const lo = new Date(x0);
  const hi = new Date(x1);
  const values = [];

  for (const item of state.series) {
    for (const p of item.series) {
      const d = new Date(p.x);
      if (d >= lo && d <= hi && Number.isFinite(p.y)) {
        values.push(p.y);
      }
    }
  }

  if (!values.length) return;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || 10;
  const y0 = min - pad;
  const y1 = max + pad;
  const step = labelStepForRange(y0, y1);

  Plotly.relayout('chart', {
    'yaxis.range': [y0, y1],
    'shapes': makeYGridShapes(y0, y1, step)
  }).then(() => {
    setTickLabelsEvery(y0, y1, step);
  });
}

/* ---------- player selection ---------- */
function selectedNames(){
  return state.inputs
    .map(r => r.input.value.trim())
    .filter(Boolean);
}

function uniqueNames(names){
  return [...new Set(names)];
}

function playerByName(name){
  return state.players.find(p => p.name === name);
}

async function loadHistory(player){
  if (state.rawById[player.id]) return state.rawById[player.id];

  const res = await fetch(HIST_URL(player.id), { cache: 'no-cache' });
  if (!res.ok) throw new Error(`history not found: ${player.name}`);

  const hist = await res.json();

  const raw = hist
    .map(h => ({ x: h.date, y: +h.rating }))
    .filter(p => Number.isFinite(p.y));

  state.rawById[player.id] = raw;

  return raw;
}

/* ---------- chart ---------- */
async function drawFromInputs(options = {}) {
  const names = uniqueNames(selectedNames());

  if (!names.length) {
    if (!options.quiet) alert('Please add at least one player');
    return;
  }

  const players = names
    .map(name => playerByName(name))
    .filter(Boolean);

  if (!players.length) {
    if (!options.quiet) alert('No matching players found.');
    return;
  }

  const mode = document.getElementById('agg').value;

  const gd = document.getElementById('chart');
  const liveLayout = gd && gd._fullLayout ? gd._fullLayout.xaxis : null;

  if (liveLayout && liveLayout.range) {
    rememberedXRange = [liveLayout.range[0], liveLayout.range[1]];
  }

  const loaded = await Promise.all(players.map(async player => {
    const raw = await loadHistory(player);
    const series = aggregateExpanded(raw, mode);

    return {
      name: player.name,
      series
    };
  }));

  state.series = loaded.filter(x => x.series.length);

  if (!state.series.length) {
    document.getElementById('chart').textContent = 'No data';
    return;
  }

  const ext = extentFrom(state.series.map(x => x.series));
  state.dataMin = ext.min;
  state.dataMax = ext.max;

  const traces = state.series.map(item => makeTrace(item.series, item.name));

  const allY = [];
  for (const item of state.series) {
    for (const p of item.series) {
      if (Number.isFinite(p.y)) allY.push(p.y);
    }
  }

  const yMin0 = allY.length ? Math.min(...allY) : 0;
  const yMax0 = allY.length ? Math.max(...allY) : 1;
  const bg = getComputedStyle(document.body).backgroundColor;

  const baseLayout = {
    margin: { l: 50, r: 28, t: 10, b: 40 },

    xaxis: {
      type: 'date',
      fixedrange: true,
      showgrid: false,
      rangeslider: { visible: false }
    },

    yaxis: {
      title: '',
      fixedrange: true,
      showgrid: false,
      zeroline: false,
      tick0: 0,
      dtick: 25,
      ticks: 'outside',
      ticklen: 4,
      tickmode: 'array',
      tickvals: [],
      ticktext: []
    },

    paper_bgcolor: bg,
    plot_bgcolor: bg,
    font: { color: getComputedStyle(document.body).color },
    legend: { orientation: 'h', x: 0, y: 1.1 },
    shapes: makeYGridShapes(yMin0, yMax0, 100)
  };

  if (!initialRangeApplied && state.dataMin && state.dataMax) {
    const rawStart = new Date('2022-01-01');
    const start = new Date(Math.max(+rawStart, +state.dataMin));
    const end = makePaddedEnd(start, state.dataMax);

    rememberedXRange = [iso(start), iso(end)];
    activeRangeKey = '2022';
    initialRangeApplied = true;
  }

  await Plotly.react('chart', traces, baseLayout, {
    staticPlot: false,
    scrollZoom: false,
    displayModeBar: false,
    responsive: true
  });

  state.chartCreated = true;

  if (rememberedXRange) {
    const [x0, x1] = clampRangeStartOnly(rememberedXRange);
    rememberedXRange = [x0, x1];

    await Plotly.relayout('chart', { 'xaxis.range': [x0, x1] });
    adjustYToVisible(x0, x1);
  }

  updateActiveRangeButton();

  const gd2 = document.getElementById('chart');

  if (!gd2._jrHandlersAttached) {
    gd2.on('plotly_relayout', ev => {
      const x0 = ev['xaxis.range[0]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][0]);
      const x1 = ev['xaxis.range[1]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][1]);

      if (x0 && x1) {
        rememberedXRange = [x0, x1];
        adjustYToVisible(x0, x1);
      }
    });

    gd2._jrHandlersAttached = true;
  }
}

/* ---------- range presets ---------- */
function setPreset(key){
  if (!state.dataMin || !state.dataMax) return;

  let start;

  if (key === 'ALL') {
    start = new Date(state.dataMin);
  } else if (key === '2015') {
    start = new Date('2015-01-01');
  } else if (key === '2022') {
    start = new Date('2022-01-01');
  } else if (key === 'LY') {
    start = new Date(state.dataMax);
    start.setFullYear(start.getFullYear() - 1);
  } else if (key === 'YTD') {
    start = new Date(state.dataMax.getFullYear() + '-01-01');
  } else {
    start = new Date(state.dataMin);
  }

  start = new Date(Math.max(+start, +state.dataMin));
  const end = makePaddedEnd(start, state.dataMax);

  const range = [iso(start), iso(end)];

  rememberedXRange = range;
  activeRangeKey = key;

  updateActiveRangeButton();

  Plotly.relayout('chart', { 'xaxis.range': range })
    .then(() => adjustYToVisible(range[0], range[1]));
}

/* ---------- autocomplete ---------- */
function attachAutocomplete(input){
  const wrap = document.createElement('div');
  wrap.className = 'suggest';

  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  const list = document.createElement('div');
  list.className = 'suggest-list';
  wrap.appendChild(list);

  function escapeHtml(s){
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function render(items){
    if (!items.length){
      list.style.display = 'none';
      list.innerHTML = '';
      return;
    }

    list.innerHTML = items
      .map(n => `<div class="suggest-item" data-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`)
      .join('');

    list.style.display = 'block';
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();

    if (!q) {
      render([]);
      return;
    }

    const names = state.players.map(p => p.name);

    const starts = names.filter(n =>
      n.toLowerCase().startsWith(q)
    );

    const contains = names.filter(n =>
      !n.toLowerCase().startsWith(q) &&
      n.toLowerCase().includes(q)
    );

    render(starts.concat(contains).slice(0, 12));
  });

  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.suggest-item');
    if (!item) return;

    input.value = item.dataset.name;
    list.style.display = 'none';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = list.querySelector('.suggest-item');

      if (first) {
        input.value = first.dataset.name;
        list.style.display = 'none';
      } else if (input.value.trim()) {
        drawFromInputs({ quiet: true });
      }
    }

    if (e.key === 'Escape') {
      list.style.display = 'none';
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(() => {
      list.style.display = 'none';
    }, 120);
  });
}

/* ---------- rows ---------- */
function makeRow(value = ''){
  if (state.inputs.length >= MAX_PLAYERS) return;

  const rows = document.getElementById('rows');

  const wrap = document.createElement('div');
  wrap.className = 'row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search player…';
  input.value = value;

  wrap.appendChild(input);
  attachAutocomplete(input);

  const remove = document.createElement('button');
  remove.className = 'btn';
  remove.type = 'button';
  remove.textContent = 'Remove';

  remove.addEventListener('click', () => {
    rows.removeChild(wrap);

    state.inputs = state.inputs.filter(r => r.el !== wrap);

    document.getElementById('add').disabled =
      state.inputs.length >= MAX_PLAYERS;

    if (state.chartCreated) {
      drawFromInputs({ quiet: true });
    }
  });

  wrap.appendChild(remove);
  rows.appendChild(wrap);

  state.inputs.push({ el: wrap, input });

  document.getElementById('add').disabled =
    state.inputs.length >= MAX_PLAYERS;
}

function clearAll(){
  document.getElementById('rows').innerHTML = '';

  state.inputs = [];
  state.series = [];
  state.dataMin = null;
  state.dataMax = null;
  state.chartCreated = false;

  rememberedXRange = null;
  activeRangeKey = '2022';
  initialRangeApplied = false;

  document.getElementById('add').disabled = false;
  document.getElementById('chart').innerHTML = '';

  updateActiveRangeButton();
  makeRow();
}

/* ---------- load ---------- */
async function load(){
  const res = await fetch(PLAYERS_URL, { cache: 'no-cache' });

  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  state.players = await res.json();
}

/* ---------- bootstrap ---------- */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('add').addEventListener('click', () => makeRow());

  document.getElementById('clear').addEventListener('click', clearAll);

  document.getElementById('create').addEventListener('click', () => {
    drawFromInputs();
  });

  document.getElementById('agg').addEventListener('change', () => {
    if (state.chartCreated) {
      drawFromInputs({ quiet: true });
    }
  });

  document.querySelectorAll('.range-buttons .seg').forEach(btn => {
    btn.addEventListener('click', () => setPreset(btn.dataset.range));
  });

  updateActiveRangeButton();

  load()
    .then(() => {
      makeRow();
    })
    .catch(e => {
      console.error(e);

      document.querySelector('.muted-note').textContent =
        'Could not load player list.';

      makeRow();
    });
});
</script>
</body>
</html>
