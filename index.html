<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>J-Ratings</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    .tabs { margin-bottom: 15px; }
    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #f0f0f0;
      margin-right: 5px;
    }
    .tab-btn.active { background: #ddd; font-weight: bold; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #f9f9f9; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>J-Ratings</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTable('live')">Live Ratings</button>
    <button class="tab-btn" onclick="showTable('peak')">Peak Ratings</button>
  </div>

  <div id="live" class="tab">
    <table id="liveTable">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Zone</th>
          <th>Club</th>
          <th>Live</th>
          <th>K</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="peak" class="tab hidden">
    <table id="peakTable">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Zone</th>
          <th>Club</th>
          <th>Peak</th>
          <th>K</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadData() {
      const response = await fetch('data/players.json');
      const players = await response.json();

      // Live: sort by rating
      const liveSorted = [...players].sort((a, b) => b.rating - a.rating);
      const liveBody = document.querySelector('#liveTable tbody');
      liveSorted.forEach((p, i) => {
        const row = `<tr>
          <td>${i + 1}</td>
          <td><a href="player.html?id=${encodeURIComponent(p.id)}">${p.name}</a></td>
          <td>${p.zone || ''}</td>
          <td>${p.club || ''}</td>
          <td>${p.rating ?? ''}</td>
          <td>${p.k ?? ''}</td>
        </tr>`;
        liveBody.insertAdjacentHTML('beforeend', row);
      });

      // Peak: sort by peak
      const peakSorted = [...players].sort((a, b) => (b.peak ?? -1) - (a.peak ?? -1));
      const peakBody = document.querySelector('#peakTable tbody');
      peakSorted.forEach((p, i) => {
        const row = `<tr>
          <td>${i + 1}</td>
          <td><a href="player.html?id=${encodeURIComponent(p.id)}">${p.name}</a></td>
          <td>${p.zone || ''}</td>
          <td>${p.club || ''}</td>
          <td>${p.peak ?? ''}</td>
          <td>${p.k ?? ''}</td>
        </tr>`;
        peakBody.insertAdjacentHTML('beforeend', row);
      });
    }

    function showTable(tab) {
      document.querySelectorAll('.tab').forEach(div => div.classList.add('hidden'));
      document.getElementById(tab).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn[onclick="showTable('${tab}')"]`).classList.add('active');
    }

    loadData();
  </script>
</body>
</html>
